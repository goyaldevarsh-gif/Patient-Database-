<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Surgical Case Log</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e293b">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Case Log">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');
  :root {
    --ink:#0f172a; --muted:#64748b; --border:#e2e8f0; --bg:#ffffff; --bg-soft:#f8fafc;
    --accent:#4338ca; --accent-dark:#3730a3;
    --amber:#b45309; --amber-bg:#fef3c7; --amber-border:#fde68a;
    --emerald:#047857; --emerald-bg:#d1fae5; --emerald-border:#a7f3d0;
    --red:#b91c1c; --red-bg:#fee2e2; --red-border:#fecaca;
    --slate:#475569; --slate-bg:#f1f5f9; --slate-border:#e2e8f0;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:#fff; color:var(--ink); }
  body { font-family:'Inter',system-ui,sans-serif; font-size:14px; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,.display { font-family:'Plus Jakarta Sans',sans-serif; }
  .mono { font-family:'JetBrains Mono',monospace; }
  #app { max-width:520px; margin:0 auto; min-height:100vh; background:#fff; position:relative; }
  button, input, select, textarea { font-family:inherit; font-size:inherit; }
  button { cursor:pointer; }
  ::-webkit-scrollbar { display:none; }

  .sticky-top { position:sticky; top:0; z-index:10; background:rgba(255,255,255,0.96); backdrop-filter:blur(6px); border-bottom:1px solid var(--border); }
  .px { padding-left:16px; padding-right:16px; }
  .row { display:flex; align-items:center; }
  .between { justify-content:space-between; }
  .gap2 { gap:8px; } .gap3 { gap:12px; }

  .icon-btn { display:inline-flex; align-items:center; justify-content:center; padding:6px; border-radius:8px; border:none; background:transparent; color:var(--muted); }
  svg.ic { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; display:block; }

  .btn { border-radius:10px; font-weight:700; padding:10px 14px; border:1px solid var(--border); background:#fff; color:var(--ink); font-size:13px; }
  .btn-primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn-primary:disabled { opacity:0.4; }
  .btn-block { width:100%; display:flex; align-items:center; justify-content:center; gap:6px; }
  .btn-sm { padding:6px 10px; font-size:11.5px; border-radius:8px; }
  .btn-danger-confirm { background:#dc2626; color:#fff; border-color:#dc2626; }
  .btn-outline-dashed { border:2px dashed #c7d2fe; color:var(--accent-dark); background:transparent; }

  .search-wrap { position:relative; margin-bottom:8px; }
  .search-wrap svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:#94a3b8; }
  .search-input { width:100%; background:var(--bg-soft); border:1px solid var(--border); border-radius:10px; padding:9px 12px 9px 34px; }

  .chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
  .chip { flex-shrink:0; border-radius:999px; border:1px solid var(--border); background:#fff; color:var(--muted); padding:6px 10px; font-size:12px; font-weight:600; white-space:nowrap; }
  .chip.active { background:var(--ink); border-color:var(--ink); color:#fff; }

  .card { border:1px solid var(--border); border-radius:12px; background:#fff; padding:14px; }
  .case-card { display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left; border:1px solid var(--border); border-radius:12px; background:#fff; padding:14px; box-shadow:0 1px 2px rgba(0,0,0,0.03); }
  .case-card:active { background:var(--bg-soft); }

  .badge { display:inline-flex; align-items:center; gap:5px; border-radius:999px; border:1px solid; padding:4px 9px; font-size:11px; font-weight:700; }
  .badge-indigo { color:var(--accent); background:#eef2ff; border-color:#c7d2fe; }
  .badge-amber { color:var(--amber); background:var(--amber-bg); border-color:var(--amber-border); }
  .badge-emerald { color:var(--emerald); background:var(--emerald-bg); border-color:var(--emerald-border); }
  .badge-red { color:var(--red); background:var(--red-bg); border-color:var(--red-border); }
  .badge-slate { color:var(--slate); background:var(--slate-bg); border-color:var(--slate-border); }

  label.field-label { display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:#94a3b8; margin-bottom:5px; }
  .input, .textarea, .select { width:100%; border:1px solid var(--border); border-radius:10px; padding:9px 11px; background:#fff; color:var(--ink); }
  .input:focus, .textarea:focus, .select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 2px rgba(67,56,202,0.15); }
  .textarea { resize:vertical; }

  .seg { display:flex; gap:6px; }
  .seg-btn { flex:1; border:1px solid var(--border); border-radius:9px; padding:9px; font-weight:700; font-size:12.5px; background:#fff; color:var(--muted); }
  .seg-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }

  .thumb-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
  .thumb-wrap { position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; border:1px solid var(--border); background:var(--bg-soft); }
  .thumb-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb-remove { position:absolute; top:3px; right:3px; background:rgba(15,23,42,0.75); color:#fff; border:none; border-radius:999px; width:20px; height:20px; font-size:12px; line-height:1; }
  .thumb-label { position:absolute; bottom:0; left:0; right:0; background:rgba(15,23,42,0.65); color:#fff; font-size:9px; padding:2px 5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .add-photo-tile { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; aspect-ratio:1; border-radius:10px; border:2px dashed #c7d2fe; color:var(--accent-dark); font-size:10.5px; font-weight:700; background:#f5f6ff; }

  .tabs { display:flex; overflow-x:auto; border-top:1px solid #f1f5f9; }
  .tab { flex-shrink:0; display:flex; align-items:center; gap:6px; padding:11px 13px; border-bottom:2px solid transparent; color:#94a3b8; font-weight:700; font-size:12px; background:none; border-left:none; border-right:none; border-top:none; }
  .tab.active { border-bottom-color:var(--accent); color:var(--accent-dark); }

  .stat-card { border:1px solid var(--border); border-radius:12px; padding:12px; background:#fff; }
  .stat-label { font-size:11px; font-weight:700; text-transform:uppercase; color:#94a3b8; }
  .stat-value { font-size:16px; font-weight:800; margin-top:4px; }

  .empty-state { display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; margin-top:56px; color:#64748b; }
  .empty-icon-wrap { background:#eef2ff; border-radius:999px; padding:16px; color:var(--accent); }

  .fu-card { border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .bottom-bar { position:sticky; bottom:0; border-top:1px solid var(--border); background:#fff; padding:10px 12px; display:flex; gap:8px; }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay img { max-width:100%; max-height:78vh; border-radius:8px; }
  .modal-bar { position:absolute; top:16px; right:16px; display:flex; gap:8px; }
  .modal-btn { background:rgba(255,255,255,0.12); color:#fff; border:none; border-radius:999px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; }
  .modal-label { color:#fff; font-size:12px; margin-top:10px; opacity:0.8; }

  .toast { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:40; background:rgba(15,23,42,0.94); color:#fff; font-size:12px; font-weight:600; padding:8px 16px; border-radius:999px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================= IndexedDB layer ================= */

const DB_NAME = 'surgical-case-db';
const DB_VERSION = 1;
let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('patients')) db.createObjectStore('patients', { keyPath:'id' });
      if (!db.objectStoreNames.contains('images')) {
        const s = db.createObjectStore('images', { keyPath:'id' });
        s.createIndex('patientId','patientId',{unique:false});
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
  return dbPromise;
}
async function storeOf(name, mode) { const db = await openDB(); return db.transaction(name, mode).objectStore(name); }
function reqToPromise(req) { return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); }

async function dbGetAllPatients() { const s = await storeOf('patients','readonly'); return reqToPromise(s.getAll()); }
async function dbPutPatient(p) { const s = await storeOf('patients','readwrite'); return reqToPromise(s.put(p)); }
async function dbDeletePatient(id) { const s = await storeOf('patients','readwrite'); return reqToPromise(s.delete(id)); }
async function dbAddImage(rec) { const s = await storeOf('images','readwrite'); return reqToPromise(s.put(rec)); }
async function dbGetImagesByPatient(patientId) {
  const s = await storeOf('images','readonly');
  const idx = s.index('patientId');
  return reqToPromise(idx.getAll(patientId));
}
async function dbDeleteImage(id) { const s = await storeOf('images','readwrite'); return reqToPromise(s.delete(id)); }
async function dbDeleteImagesByPatient(patientId) {
  const imgs = await dbGetImagesByPatient(patientId);
  for (const img of imgs) await dbDeleteImage(img.id);
}

/* ================= Image resize (with safe fallback) ================= */

function resizeImageFile(file, maxDim, quality) {
  maxDim = maxDim || 1600; quality = quality || 0.82;
  return new Promise((resolve) => {
    try {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        try {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width > height) { height = Math.round(height * maxDim/width); width = maxDim; }
            else { width = Math.round(width * maxDim/height); height = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob((blob) => {
            URL.revokeObjectURL(url);
            resolve(blob || file); // fallback to original if toBlob fails
          }, 'image/jpeg', quality);
        } catch (err) { URL.revokeObjectURL(url); resolve(file); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    } catch (err) { resolve(file); }
  });
}

/* ================= Helpers ================= */

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(d) { if (!d) return '\u2014'; const dt = new Date(d); if (isNaN(dt)) return '\u2014'; return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function todayStr() { return new Date().toISOString().slice(0,10); }

const SURGERY_TYPES = ['Arthroplasty','Arthroscopy','Trauma','Spine','Other'];
const TYPE_BADGE = { Arthroplasty:'indigo', Arthroscopy:'emerald', Trauma:'red', Spine:'amber', Other:'slate' };
const STATUS_OPTIONS = ['Active follow-up','Completed','Lost to follow-up'];

const ICONS = {
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  search:'<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  back:'<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',
  trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
  chevron:'<polyline points="9 18 15 12 9 6"/>',
  camera:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
  info:'<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
  clipboard:'<path d="M9 2h6a1 1 0 0 1 1 1v1H8V3a1 1 0 0 1 1-1z"/><rect x="6" y="4" width="12" height="17" rx="1.5"/><line x1="9" y1="10.5" x2="15" y2="10.5"/><line x1="9" y1="14.5" x2="15" y2="14.5"/>',
  calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/>',
  x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
};
function ic(name) { return '<svg class="ic" viewBox="0 0 24 24">'+ICONS[name]+'</svg>'; }

/* ================= State ================= */

let PATIENTS = [];
let VIEW = 'list';
let SELECTED_ID = null;
let SEARCH = '';
let FILTER_TYPE = 'all';
let TAB = 'overview';
let ARMED_DELETE = null;
let ADD_FOLLOWUP_OPEN = false;
let EXPANDED_FOLLOWUP = new Set();
let ACTIVE_URLS = [];

function revokeActiveUrls() { ACTIVE_URLS.forEach(u => { try { URL.revokeObjectURL(u); } catch(e){} }); ACTIVE_URLS = []; }
function trackUrl(u) { ACTIVE_URLS.push(u); return u; }

// temp state for add-patient photo staging: [{tempId, blob, previewUrl, label}]
let AP_PHOTOS = [];
// temp state for add-followup photo staging
let FU_PHOTOS = [];

function newPatientShape() {
  return {
    id: uid(), name:'', age:'', sex:'M', diagnosis:'', surgeryType:'Arthroplasty', procedure:'',
    side:'N/A', surgeryDate: todayStr(), status:'Active follow-up', notes:'',
    preOpImageCount:0, followUps:[], createdAt: Date.now(),
  };
}

async function refreshPatients() { PATIENTS = await dbGetAllPatients(); }
function getPatient(id) { return PATIENTS.find(p => p.id === id); }
async function savePatient(p) { await dbPutPatient(p); await refreshPatients(); }

/* ================= Toast ================= */

function toast(msg) {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id='toast'; el.className='toast'; document.getElementById('app').appendChild(el); }
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => { el.style.display = 'none'; }, 1800);
}

/* ================= List view ================= */

function renderListView() {
  const counts = { all: PATIENTS.length };
  SURGERY_TYPES.forEach(t => counts[t] = PATIENTS.filter(p => p.surgeryType === t).length);

  const filtered = PATIENTS.filter(p => {
    if (FILTER_TYPE !== 'all' && p.surgeryType !== FILTER_TYPE) return false;
    if (SEARCH) {
      const q = SEARCH.toLowerCase();
      if (!(p.name.toLowerCase().includes(q) || (p.diagnosis||'').toLowerCase().includes(q) || (p.procedure||'').toLowerCase().includes(q))) return false;
    }
    return true;
  }).sort((a,b) => new Date(b.surgeryDate) - new Date(a.surgeryDate));

  let chips = '<div class="chips">';
  ['all', ...SURGERY_TYPES].forEach(t => {
    chips += '<button class="chip'+(FILTER_TYPE===t?' active':'')+'" data-action="set-filter" data-value="'+t+'">'+(t==='all'?'All':t)+' ('+counts[t]+')</button>';
  });
  chips += '</div>';

  let cards = '';
  if (!filtered.length) {
    cards = '<div class="empty-state">'
      + '<div class="empty-icon-wrap">'+ic('clipboard')+'</div>'
      + '<p style="font-weight:500;">'+(PATIENTS.length===0 ? 'Koi case abhi tak add nahi hua. Pehla case add karo.' : 'Is search/filter se koi case nahi mila.')+'</p>'
      + (PATIENTS.length===0 ? '<button class="btn btn-primary" style="width:auto;padding:9px 18px;" data-action="go-add">'+ic('plus')+' Add case</button>' : '')
      + '</div>';
  } else {
    cards = '<div style="display:flex;flex-direction:column;gap:10px;">';
    filtered.forEach(p => {
      const fuImgCount = (p.followUps||[]).reduce((s,f) => s + (f.imageCount||0), 0);
      cards += '<button class="case-card" data-action="open-patient" data-id="'+p.id+'">'
        + '<div style="min-width:0;flex:1;">'
        + '<div class="row gap2"><span class="display" style="font-weight:800;font-size:15px;">'+esc(p.name)+'</span>'
        + '<span class="mono" style="font-size:11px;color:#94a3b8;">'+esc(p.age)+'/'+esc(p.sex)+'</span></div>'
        + '<div style="font-size:12px;color:#64748b;margin-top:2px;">'+esc(p.procedure||'\u2014')+' \u00b7 '+p.side+' \u00b7 '+fmtDate(p.surgeryDate)+'</div>'
        + '<div style="font-size:11.5px;color:#94a3b8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(p.diagnosis||'')+'</div>'
        + '<div style="margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">'
        + '<span class="badge badge-'+TYPE_BADGE[p.surgeryType]+'">'+p.surgeryType+'</span>'
        + '<span class="badge badge-slate">'+ic('camera')+p.preOpImageCount+' pre-op \u00b7 '+fuImgCount+' f/u</span>'
        + '</div></div>'
        + '<span style="color:#cbd5e1;margin-left:8px;">'+ic('chevron')+'</span>'
        + '</button>';
    });
    cards += '</div>';
  }

  return '<div style="padding-bottom:90px;">'
    + '<div class="sticky-top px" style="padding-top:16px;padding-bottom:10px;">'
    + '<div class="row between" style="margin-bottom:10px;">'
    + '<div><h1 style="font-size:18px;font-weight:800;margin:0;">Surgical Case Log</h1><p style="font-size:11px;color:#94a3b8;margin:2px 0 0;">'+PATIENTS.length+' case'+(PATIENTS.length!==1?'s':'')+' on record</p></div>'
    + '<div class="row gap2">'
    + '<button class="icon-btn" data-action="export-backup" title="Export backup">'+ic('download')+'</button>'
    + '<button class="btn btn-primary" style="display:flex;align-items:center;gap:5px;padding:9px 12px;" data-action="go-add">'+ic('plus')+' Add</button>'
    + '</div></div>'
    + '<div class="search-wrap">'+ic('search')+'<input class="search-input" id="search-input" placeholder="Search name, diagnosis, procedure\u2026" value="'+esc(SEARCH)+'"></div>'
    + chips
    + '</div>'
    + '<div class="px" style="padding-top:12px;">'+cards+'</div>'
    + '</div>';
}

/* ================= Add photo thumb helpers (shared by add-patient & add-followup) ================= */

function thumbGridHtml(photos, removeAction) {
  let html = '<div class="thumb-grid">';
  photos.forEach(ph => {
    html += '<div class="thumb-wrap"><img src="'+ph.previewUrl+'"><button class="thumb-remove" data-action="'+removeAction+'" data-tempid="'+ph.tempId+'">\u2715</button></div>';
  });
  html += '<label class="add-photo-tile">'+ic('camera')+'<span>Add</span><input type="file" accept="image/*" multiple data-photo-input="'+removeAction+'" style="display:none;"></label>';
  html += '</div>';
  return html;
}

async function handlePhotoInputChange(fileInput, targetArray, containerId) {
  const files = Array.from(fileInput.files || []);
  if (!files.length) return;
  toast('Processing '+files.length+' photo'+(files.length>1?'s':'')+'\u2026');
  for (const file of files) {
    const blob = await resizeImageFile(file);
    const previewUrl = trackUrl(URL.createObjectURL(blob));
    targetArray.push({ tempId: uid(), blob, previewUrl, label:'' });
  }
  const container = document.getElementById(containerId);
  if (container) container.outerHTML = '<div id="'+containerId+'">'+thumbGridHtml(targetArray, containerId==='ap-thumbs'?'ap-remove-photo':'fu-remove-photo')+'</div>';
  toast('Added');
}

/* ================= Add patient view ================= */

function renderAddView() {
  return '<div style="padding-bottom:90px;">'
    + '<div class="sticky-top px row gap3" style="padding:14px 16px;">'
    + '<button class="icon-btn" data-action="cancel-add">'+ic('back')+'</button>'
    + '<h2 style="font-size:16px;font-weight:800;margin:0;">New surgical case</h2>'
    + '</div>'
    + '<div class="px" style="padding-top:16px;display:flex;flex-direction:column;gap:16px;">'
    + '<div><label class="field-label">Patient name</label><input class="input" id="ap-name" placeholder="Patient name"></div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">'
    + '<div><label class="field-label">Age</label><input class="input" type="number" id="ap-age" placeholder="Age"></div>'
    + '<div><label class="field-label">Sex</label><div class="seg">'
    + ['M','F'].map(s=>'<button class="seg-btn'+(s==='M'?' active':'')+'" data-action="ap-set-sex" data-value="'+s+'">'+s+'</button>').join('') + '</div></div>'
    + '</div>'
    + '<div><label class="field-label">Diagnosis</label><textarea class="textarea" id="ap-diagnosis" rows="2" placeholder="e.g. Right knee primary OA, K-L grade 4"></textarea></div>'
    + '<div><label class="field-label">Surgery type</label><select class="select" id="ap-type">'+SURGERY_TYPES.map(t=>'<option>'+t+'</option>').join('')+'</select></div>'
    + '<div><label class="field-label">Procedure</label><input class="input" id="ap-procedure" placeholder="e.g. Total Knee Replacement"></div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">'
    + '<div><label class="field-label">Side</label><select class="select" id="ap-side"><option>Left</option><option>Right</option><option>Bilateral</option><option>N/A</option></select></div>'
    + '<div><label class="field-label">Surgery date</label><input class="input" type="date" id="ap-date" value="'+todayStr()+'"></div>'
    + '</div>'
    + '<div><label class="field-label">Pre-op imaging (X-ray/CT/MRI photos)</label><div id="ap-thumbs">'+thumbGridHtml(AP_PHOTOS,'ap-remove-photo')+'</div></div>'
    + '<div><label class="field-label">Notes</label><textarea class="textarea" id="ap-notes" rows="3" placeholder="Findings, plan, relevant history\u2026"></textarea></div>'
    + '</div>'
    + '<div class="bottom-bar" style="position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;">'
    + '<button class="btn" style="flex:1;" data-action="cancel-add">Cancel</button>'
    + '<button class="btn btn-primary" style="flex:2;" data-action="save-patient">Save case</button>'
    + '</div>'
    + '</div>';
}

/* ================= Detail view: tabs ================= */

function renderOverviewTab(p) {
  return '<div class="px" style="display:flex;flex-direction:column;gap:12px;padding-top:14px;padding-bottom:20px;">'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">'
    + '<div class="stat-card"><div class="stat-label">Pre-op photos</div><div class="stat-value mono">'+p.preOpImageCount+'</div></div>'
    + '<div class="stat-card"><div class="stat-label">Follow-up visits</div><div class="stat-value mono">'+(p.followUps||[]).length+'</div></div>'
    + '</div>'
    + '<div class="card">'
    + '<label class="field-label">Diagnosis</label><textarea class="textarea" rows="2" data-field="diagnosis">'+esc(p.diagnosis)+'</textarea>'
    + '</div>'
    + '<div class="card" style="display:flex;flex-direction:column;gap:10px;">'
    + '<div><label class="field-label">Surgery type</label><select class="select" data-field="surgeryType">'+SURGERY_TYPES.map(t=>'<option'+(p.surgeryType===t?' selected':'')+'>'+t+'</option>').join('')+'</select></div>'
    + '<div><label class="field-label">Procedure</label><input class="input" data-field="procedure" value="'+esc(p.procedure)+'"></div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">'
    + '<div><label class="field-label">Side</label><select class="select" data-field="side">'+['Left','Right','Bilateral','N/A'].map(s=>'<option'+(p.side===s?' selected':'')+'>'+s+'</option>').join('')+'</select></div>'
    + '<div><label class="field-label">Surgery date</label><input class="input" type="date" data-field="surgeryDate" value="'+esc(p.surgeryDate)+'"></div>'
    + '</div>'
    + '<div><label class="field-label">Age</label><input class="input" type="number" data-field="age" value="'+esc(p.age)+'"></div>'
    + '</div>'
    + '<div class="card"><label class="field-label">Clinical notes</label><textarea class="textarea" rows="5" data-field="notes" placeholder="Intra-op findings, complications, plan\u2026">'+esc(p.notes)+'</textarea></div>'
    + '</div>';
}

function confirmBtn(action, id) {
  const armed = ARMED_DELETE === action+':'+id;
  if (armed) return '<button class="btn btn-sm btn-danger-confirm" data-action="'+action+'" data-id="'+id+'" data-confirm="1">'+ic('check')+' Confirm</button>';
  return '<button class="icon-btn" data-action="arm-delete" data-arm="'+action+':'+id+'">'+ic('trash')+'</button>';
}

async function renderPreopTab(p) {
  const images = (await dbGetImagesByPatient(p.id)).filter(im => !im.followUpId);
  revokeActiveUrls();
  let grid = '<div class="thumb-grid">';
  images.forEach(im => {
    const url = trackUrl(URL.createObjectURL(im.blob));
    grid += '<div class="thumb-wrap" data-action="view-image" data-imgid="'+im.id+'" data-url="'+esc(url)+'"><img src="'+url+'"></div>';
  });
  grid += '<label class="add-photo-tile">'+ic('camera')+'<span>Add</span><input type="file" accept="image/*" multiple id="preop-add-input" style="display:none;"></label>';
  grid += '</div>';
  return '<div class="px" style="padding-top:14px;padding-bottom:20px;">'
    + (images.length ? grid : '<div style="text-align:center;color:#94a3b8;font-size:12px;padding:20px 0;">Koi pre-op photo nahi hai abhi.</div>'+grid.replace('<div class="thumb-grid">','<div class="thumb-grid" style="grid-template-columns:1fr;">'))
    + '</div>';
}

async function renderFollowupsTab(p) {
  const allImages = await dbGetImagesByPatient(p.id);
  revokeActiveUrls();
  let addBlock;
  if (!ADD_FOLLOWUP_OPEN) {
    addBlock = '<button class="btn btn-outline-dashed btn-block" data-action="open-add-fu">'+ic('plus')+' Add follow-up visit</button>';
  } else {
    addBlock = '<div class="card" style="background:rgba(67,56,202,0.04);border-color:#c7d2fe;margin-bottom:12px;">'
      + '<label class="field-label">Visit label</label><input class="input" id="fu-label" placeholder="e.g. 2 weeks / 6 weeks / 3 months" style="margin-bottom:10px;">'
      + '<label class="field-label">Visit date</label><input class="input" type="date" id="fu-date" value="'+todayStr()+'" style="margin-bottom:10px;">'
      + '<label class="field-label">Photos</label><div id="fu-thumbs">'+thumbGridHtml(FU_PHOTOS,'fu-remove-photo')+'</div>'
      + '<label class="field-label" style="margin-top:10px;">Notes</label><textarea class="textarea" id="fu-notes" rows="2" placeholder="Wound status, ROM, complications\u2026"></textarea>'
      + '<div class="row gap2" style="margin-top:10px;"><button class="btn" style="flex:1;" data-action="cancel-add-fu">Cancel</button><button class="btn btn-primary" style="flex:2;" data-action="submit-fu">Save visit</button></div>'
      + '</div>';
  }

  let list = '';
  [...(p.followUps||[])].reverse().forEach(f => {
    const expanded = EXPANDED_FOLLOWUP.has(f.id);
    const fuImages = allImages.filter(im => im.followUpId === f.id);
    let body = '';
    if (expanded) {
      let grid = '<div class="thumb-grid">';
      fuImages.forEach(im => {
        const url = trackUrl(URL.createObjectURL(im.blob));
        grid += '<div class="thumb-wrap" data-action="view-image" data-imgid="'+im.id+'" data-url="'+esc(url)+'"><img src="'+url+'"></div>';
      });
      grid += '<label class="add-photo-tile" data-fu-add="'+f.id+'">'+ic('camera')+'<span>Add</span><input type="file" accept="image/*" multiple data-fu-input="'+f.id+'" style="display:none;"></label>';
      grid += '</div>';
      body = grid + (f.notes ? '<p style="font-size:12.5px;color:#64748b;margin-top:8px;">'+esc(f.notes)+'</p>' : '');
    }
    list += '<div class="fu-card">'
      + '<div class="row between" style="cursor:pointer;" data-action="toggle-fu" data-id="'+f.id+'">'
      + '<span style="font-weight:800;">'+esc(f.label)+' <span style="font-weight:400;color:#94a3b8;">\u00b7 '+fmtDate(f.date)+'</span></span>'
      + '<div class="row gap2">'
      + '<span class="badge badge-slate">'+ic('camera')+(f.imageCount||0)+'</span>'
      + confirmBtn('delete-fu', f.id)
      + '</div></div>'
      + body
      + '</div>';
  });

  return '<div class="px" style="padding-top:14px;padding-bottom:20px;">'+addBlock+list+'</div>';
}

async function renderTabBody(p) {
  const el = document.getElementById('tab-body');
  if (!el) return;
  if (TAB === 'overview') { el.innerHTML = renderOverviewTab(p); return; }
  el.innerHTML = '<div class="px" style="padding-top:30px;text-align:center;color:#94a3b8;">Loading\u2026</div>';
  if (TAB === 'preop') el.innerHTML = await renderPreopTab(p);
  else if (TAB === 'followups') el.innerHTML = await renderFollowupsTab(p);
}

const TABS = [
  {key:'overview', label:'Overview', icon:'info'},
  {key:'preop', label:'Pre-op', icon:'camera'},
  {key:'followups', label:'Follow-ups', icon:'calendar'},
];

function renderDetailShell(p) {
  let tabsHtml = TABS.map(t => '<button class="tab'+(TAB===t.key?' active':'')+'" data-action="set-tab" data-value="'+t.key+'">'+ic(t.icon)+t.label+'</button>').join('');
  let statusOptions = STATUS_OPTIONS.map(s => '<option'+(p.status===s?' selected':'')+'>'+s+'</option>').join('');
  return '<div style="padding-bottom:20px;">'
    + '<div class="sticky-top">'
    + '<div class="row gap3 px" style="padding:14px 16px 10px;">'
    + '<button class="icon-btn" data-action="back-to-list">'+ic('back')+'</button>'
    + '<div style="min-width:0;flex:1;"><h2 style="font-size:16px;font-weight:800;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(p.name)+'</h2>'
    + '<p style="font-size:11px;color:#94a3b8;margin:1px 0 0;">'+p.surgeryType+' \u00b7 '+esc(p.procedure||'')+'</p></div>'
    + confirmBtn('delete-patient', p.id)
    + '</div>'
    + '<div class="px" style="padding-bottom:10px;"><select class="select" style="font-weight:700;" data-field="status">'+statusOptions+'</select></div>'
    + '<div class="tabs px">'+tabsHtml+'</div>'
    + '</div>'
    + '<div id="tab-body"></div>'
    + '</div>';
}

/* ================= Root render ================= */

async function render() {
  const app = document.getElementById('app');
  if (VIEW === 'list') { app.innerHTML = renderListView(); return; }
  if (VIEW === 'add') { app.innerHTML = renderAddView(); return; }
  if (VIEW === 'detail') {
    const p = getPatient(SELECTED_ID);
    if (!p) { VIEW='list'; return render(); }
    app.innerHTML = renderDetailShell(p);
    await renderTabBody(p);
    return;
  }
}

/* ================= Field patching (detail view) ================= */

async function patchField(field, value) {
  const p = getPatient(SELECTED_ID);
  if (!p) return;
  p[field] = value;
  await savePatient(p);
}

/* ================= Image viewer modal ================= */

function openImageViewer(url, imgId) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'img-viewer';
  overlay.innerHTML = '<div class="modal-bar">'
    + '<button class="modal-btn" data-action="viewer-delete" data-imgid="'+imgId+'">'+ic('trash')+'</button>'
    + '<button class="modal-btn" data-action="viewer-close">'+ic('x')+'</button>'
    + '</div>'
    + '<img src="'+url+'">';
  document.body.appendChild(overlay);
}
function closeImageViewer() { const el = document.getElementById('img-viewer'); if (el) el.remove(); }

/* ================= Export backup ================= */

async function exportBackup() {
  if (typeof JSZip === 'undefined') { toast('Backup tool load nahi hua \u2014 internet check karo'); return; }
  toast('Preparing backup\u2026');
  try {
    const zip = new JSZip();
    const allPatients = await dbGetAllPatients();
    zip.file('cases.json', JSON.stringify(allPatients, null, 2));
    for (const p of allPatients) {
      const images = await dbGetImagesByPatient(p.id);
      for (const im of images) {
        const folder = im.followUpId ? ('images/'+p.id+'/followup_'+im.followUpId) : ('images/'+p.id+'/preop');
        zip.file(folder+'/'+im.id+'.jpg', im.blob);
      }
    }
    const blob = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'surgical-case-log-backup-'+todayStr()+'.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Backup downloaded');
  } catch (err) {
    toast('Backup failed: '+err.message);
  }
}

/* ================= Events ================= */

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  if (action === 'go-add') { AP_PHOTOS = []; VIEW='add'; render(); return; }
  if (action === 'cancel-add') { AP_PHOTOS = []; VIEW='list'; render(); return; }
  if (action === 'open-patient') { SELECTED_ID = el.dataset.id; VIEW='detail'; TAB='overview'; ADD_FOLLOWUP_OPEN=false; EXPANDED_FOLLOWUP.clear(); await render(); return; }
  if (action === 'back-to-list') { revokeActiveUrls(); VIEW='list'; await refreshPatients(); render(); return; }
  if (action === 'set-filter') { FILTER_TYPE = el.dataset.value; render(); return; }
  if (action === 'set-tab') { TAB = el.dataset.value; ADD_FOLLOWUP_OPEN=false; const p = getPatient(SELECTED_ID); document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active'); await renderTabBody(p); return; }

  if (action === 'ap-set-sex') {
    document.querySelectorAll('[data-action="ap-set-sex"]').forEach(b => b.classList.toggle('active', b===el));
    el.dataset.selected = 'true';
    return;
  }

  if (action === 'ap-remove-photo') { AP_PHOTOS = AP_PHOTOS.filter(p => p.tempId !== el.dataset.tempid); document.getElementById('ap-thumbs').innerHTML = thumbGridHtml(AP_PHOTOS,'ap-remove-photo'); return; }
  if (action === 'fu-remove-photo') { FU_PHOTOS = FU_PHOTOS.filter(p => p.tempId !== el.dataset.tempid); document.getElementById('fu-thumbs').innerHTML = thumbGridHtml(FU_PHOTOS,'fu-remove-photo'); return; }

  if (action === 'save-patient') {
    const name = document.getElementById('ap-name').value.trim();
    if (!name) { toast('Naam zaroori hai'); return; }
    const sexBtn = document.querySelector('[data-action="ap-set-sex"].active');
    const p = newPatientShape();
    p.name = name;
    p.age = document.getElementById('ap-age').value;
    p.sex = sexBtn ? sexBtn.dataset.value : 'M';
    p.diagnosis = document.getElementById('ap-diagnosis').value;
    p.surgeryType = document.getElementById('ap-type').value;
    p.procedure = document.getElementById('ap-procedure').value;
    p.side = document.getElementById('ap-side').value;
    p.surgeryDate = document.getElementById('ap-date').value;
    p.notes = document.getElementById('ap-notes').value;
    p.preOpImageCount = AP_PHOTOS.length;
    await dbPutPatient(p);
    for (const ph of AP_PHOTOS) {
      await dbAddImage({ id: uid(), patientId: p.id, followUpId: null, blob: ph.blob, createdAt: Date.now() });
    }
    await refreshPatients();
    AP_PHOTOS = [];
    VIEW = 'list'; render();
    return;
  }

  if (action === 'open-add-fu') { FU_PHOTOS = []; ADD_FOLLOWUP_OPEN = true; const p = getPatient(SELECTED_ID); await renderTabBody(p); return; }
  if (action === 'cancel-add-fu') { ADD_FOLLOWUP_OPEN = false; const p = getPatient(SELECTED_ID); await renderTabBody(p); return; }
  if (action === 'submit-fu') {
    const p = getPatient(SELECTED_ID);
    const label = document.getElementById('fu-label').value.trim() || 'Follow-up';
    const date = document.getElementById('fu-date').value;
    const notes = document.getElementById('fu-notes').value;
    const fu = { id: uid(), label, date, notes, imageCount: FU_PHOTOS.length };
    p.followUps = p.followUps || [];
    p.followUps.push(fu);
    await dbPutPatient(p);
    for (const ph of FU_PHOTOS) {
      await dbAddImage({ id: uid(), patientId: p.id, followUpId: fu.id, blob: ph.blob, createdAt: Date.now() });
    }
    await refreshPatients();
    FU_PHOTOS = []; ADD_FOLLOWUP_OPEN = false;
    await renderTabBody(getPatient(SELECTED_ID));
    return;
  }

  if (action === 'toggle-fu') {
    const id = el.dataset.id;
    if (EXPANDED_FOLLOWUP.has(id)) EXPANDED_FOLLOWUP.delete(id); else EXPANDED_FOLLOWUP.add(id);
    await renderTabBody(getPatient(SELECTED_ID));
    return;
  }

  if (action === 'arm-delete') {
    ARMED_DELETE = el.dataset.arm;
    await render_only_current_view();
    setTimeout(async ()=>{ if (ARMED_DELETE===el.dataset.arm){ ARMED_DELETE=null; await render_only_current_view(); } }, 3000);
    return;
  }

  if (action === 'delete-fu' && el.dataset.confirm) {
    const p = getPatient(SELECTED_ID);
    const fu = (p.followUps||[]).find(f => f.id === el.dataset.id);
    if (fu) {
      const imgs = await dbGetImagesByPatient(p.id);
      for (const im of imgs.filter(i => i.followUpId === fu.id)) await dbDeleteImage(im.id);
    }
    p.followUps = (p.followUps||[]).filter(f => f.id !== el.dataset.id);
    await dbPutPatient(p);
    await refreshPatients();
    ARMED_DELETE = null;
    await renderTabBody(getPatient(SELECTED_ID));
    return;
  }

  if (action === 'delete-patient' && el.dataset.confirm) {
    await dbDeleteImagesByPatient(el.dataset.id);
    await dbDeletePatient(el.dataset.id);
    await refreshPatients();
    ARMED_DELETE = null; VIEW='list'; render();
    return;
  }

  if (action === 'view-image') { openImageViewer(el.dataset.url, el.dataset.imgid); return; }
  if (action === 'viewer-close') { closeImageViewer(); return; }
  if (action === 'viewer-delete') {
    await dbDeleteImage(el.dataset.imgid);
    closeImageViewer();
    const p = getPatient(SELECTED_ID);
    if (!p.followUps || TAB === 'preop') {
      p.preOpImageCount = (await dbGetImagesByPatient(p.id)).filter(i=>!i.followUpId).length;
      await dbPutPatient(p); await refreshPatients();
    }
    await renderTabBody(getPatient(SELECTED_ID));
    return;
  }

  if (action === 'export-backup') { await exportBackup(); return; }
});

async function render_only_current_view() {
  await render();
}

document.addEventListener('change', async (e) => {
  const t = e.target;

  if (t.matches && t.matches('[data-photo-input]')) {
    const which = t.dataset.photoInput;
    if (which === 'ap-remove-photo') await handlePhotoInputChange(t, AP_PHOTOS, 'ap-thumbs');
    else if (which === 'fu-remove-photo') await handlePhotoInputChange(t, FU_PHOTOS, 'fu-thumbs');
    return;
  }
  if (t.dataset && t.dataset.field) {
    await patchField(t.dataset.field, t.value);
    return;
  }
  if (t.id === 'preop-add-input') {
    const files = Array.from(t.files || []);
    if (!files.length) return;
    const p = getPatient(SELECTED_ID);
    toast('Uploading '+files.length+' photo'+(files.length>1?'s':'')+'\u2026');
    for (const file of files) {
      const blob = await resizeImageFile(file);
      await dbAddImage({ id: uid(), patientId: p.id, followUpId: null, blob, createdAt: Date.now() });
    }
    p.preOpImageCount = (await dbGetImagesByPatient(p.id)).filter(i=>!i.followUpId).length;
    await dbPutPatient(p); await refreshPatients();
    await renderTabBody(getPatient(SELECTED_ID));
    return;
  }
  if (t.dataset && t.dataset.fuInput) {
    const fuId = t.dataset.fuInput;
    const files = Array.from(t.files || []);
    if (!files.length) return;
    const p = getPatient(SELECTED_ID);
    toast('Uploading '+files.length+' photo'+(files.length>1?'s':'')+'\u2026');
    for (const file of files) {
      const blob = await resizeImageFile(file);
      await dbAddImage({ id: uid(), patientId: p.id, followUpId: fuId, blob, createdAt: Date.now() });
    }
    const fu = (p.followUps||[]).find(f => f.id === fuId);
    if (fu) fu.imageCount = (await dbGetImagesByPatient(p.id)).filter(i=>i.followUpId===fuId).length;
    await dbPutPatient(p); await refreshPatients();
    await renderTabBody(getPatient(SELECTED_ID));
    return;
  }
});

document.addEventListener('blur', async (e) => {
  if (e.target.id === 'search-input') { SEARCH = e.target.value; render(); }
}, true);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target && e.target.id === 'search-input') { SEARCH = e.target.value; render(); }
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('service-worker.js').catch(()=>{}); });
}

/* ================= Init ================= */

(async () => {
  await refreshPatients();
  render();
})();
</script>
