async function generateSHA256Checksum(blob) {
  const buffer = await blob.arrayBuffer();
  const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  return hashHex;
}

function verifyBackupChecksum(expectedChecksum, computedChecksum) {
  return expectedChecksum.trim().toLowerCase() === computedChecksum.toLowerCase();
}

/* ================= CRITICAL OVERDUE SOUND ALERT ================= */
function playCriticalAlert() {
  // Short beep using Web Audio API — no external audio file needed
  try {
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);
    oscillator.frequency.value = 800;
    oscillator.type = 'sine';
    gainNode.gain.setValueAtTime(0.25, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
    oscillator.start(audioContext.currentTime);
    oscillator.stop(audioContext.currentTime + 0.4);
  } catch(e) {}
}

async function exportBackup(auto) {
  if (typeof JSZip === 'undefined') { if (!auto) toast('Backup tool failed to load \u2014 check your internet connection'); return; }
  if (!auto) toast('Preparing backup\u2026');

  // Manual export only (needs a direct user gesture): let the person pick exactly where to save,
  // e.g. straight into a Google Drive-synced folder for an automatic off-device copy.
  let fileHandle = null;
  if (!auto && window.showSaveFilePicker) {
    try {
      fileHandle = await window.showSaveFilePicker({
        suggestedName: 'OrthoVault-backup-'+todayStr()+'.zip',
        types: [{ description: 'Zip file', accept: {'application/zip': ['.zip']} }]
      });
    } catch (err) {
      if (err && err.name === 'AbortError') return; // person cancelled the picker \u2014 don't fall back, just stop
      fileHandle = null; // picker unavailable for some other reason \u2014 fall back to a normal download below
    }
  }

  try {
    const zip = new JSZip();
    const allPatients = await dbGetAllPatients();
    
    // Include soft-deleted patients for recovery safety (kept for 30 days)
    zip.file('cases.json', JSON.stringify(allPatients, null, 2));
    zip.file('reminders.json', JSON.stringify(REMINDERS, null, 2));
    zip.file('profile.json', JSON.stringify(loadProfile(), null, 2));
    
    // TASK 1: Backup medicine library, investigation library, and RX templates
    const medLibrary = loadMedLibrary();
    const rxTemplates = loadRxTemplates();
    if (medLibrary.length) zip.file('medicine-library.json', JSON.stringify(medLibrary, null, 2));
    if (rxTemplates.length) zip.file('rx-templates.json', JSON.stringify(rxTemplates, null, 2));
    
    // Investigation library (if exists in localStorage)
    try {
      const invLib = localStorage.getItem(INVESTIGATION_LIB_KEY);
      if (invLib) zip.file('investigation-library.json', invLib);
    } catch(e) {}
    
    /* P2: Batch image fetches with Promise.all instead of sequential awaits */
    const patientImageArrays = await Promise.all(allPatients.map(p => dbGetImagesByPatient(p.id)));
    allPatients.forEach((p, idx) => {
      const images = patientImageArrays[idx] || [];
      for (const im of images) {
        const folder = im.followUpId ? ('images/'+p.id+'/followup_'+im.followUpId)
          : im.investigationId ? ('images/'+p.id+'/investigation_'+im.investigationId)
          : im.isIntraOp ? ('images/'+p.id+'/ot')
          : ('images/'+p.id+'/preop');
        
        // TASK 3: Warn if video is too large (compressed versions would be better)
        // For backup: include as-is but flag for user
        let fileToBackup = im.blob;
        const isVideo = im.blob.type.startsWith('video/');
        const sizeInMB = (im.blob.size / (1024*1024)).toFixed(1);
        
        // If video > 50MB, consider it uncompressed and note it
        if (isVideo && im.blob.size > 50*1024*1024) {
          console.warn(`Large video detected: ${sizeInMB}MB - consider compressing for cloud backup`);
        }
        
        zip.file(folder+'/'+im.id+(isVideo ? '.mp4' : '.jpg'), fileToBackup);
      }
    });
    
    // TASK 4 & 5: Generate manifest with metadata
    const manifest = {
      backupDate: new Date().toISOString(),
      appVersion: '2.4.1',
      totalCases: allPatients.length,
      activePatients: allPatients.filter(p => !p.deletedAt).length,
      deletedPatients: allPatients.filter(p => p.deletedAt).length,
      totalReminders: (REMINDERS || []).length,
      hasLibraries: {
        medicines: medLibrary.length > 0 ? medLibrary.length : 0,
        investigations: !!localStorage.getItem(INVESTIGATION_LIB_KEY),
        rxTemplates: rxTemplates.length > 0 ? rxTemplates.length : 0
      },
      backupType: auto ? 'automatic' : 'manual',
      checksumAlgorithm: 'SHA-256'
    };
    zip.file('BACKUP_MANIFEST.json', JSON.stringify(manifest, null, 2));
    
    const blob = await zip.generateAsync({type:'blob'});
    
    // TASK 4: Generate SHA256 checksum
    const checksumValue = await generateSHA256Checksum(blob);
    
    // Add checksum to zip (recreate zip with checksum included)
    const finalZip = new JSZip();
    // Copy all existing files
    for (const [path, file] of Object.entries(zip.files)) {
      if (!file.dir) {
        const data = await file.async('blob');
        finalZip.file(path, data);
      }
    }
    finalZip.file('BACKUP_CHECKSUM.sha256', checksumValue + '  OrthoVault-backup.zip');
    
    const finalBlob = await finalZip.generateAsync({type:'blob'});
    
    // TASK 5: Smart filename with case count
    const caseCount = allPatients.filter(p => !p.deletedAt).length;
    const allImages = await dbGetAllImagesWithCache();
    const photoCount = allImages.length;
    const filename = `OrthoVault-backup-${todayStr()}-${caseCount}c${photoCount}p.zip`;
    
    if (fileHandle) {
      const writable = await fileHandle.createWritable();
      await writable.write(finalBlob);
      await writable.close();
    } else {
      const file = new File([finalBlob], filename, { type: 'application/zip' });
      if (!auto && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
      } else {
        const url = URL.createObjectURL(finalBlob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      }
    }
    try { localStorage.setItem(BACKUP_REMINDER_KEY, String(Date.now())); } catch(e) {}
    trackBackupCreated();
    BACKUP_BANNER_DISMISSED = true;
    if (auto) {
      const caseCount = (await dbGetAllPatients()).length;
      const imageCount = (await dbGetAllImages().catch(() => [])).length;
      toast('✓ Auto-backup: ' + caseCount + ' case' + (caseCount!==1?'s':'') + ', ' + imageCount + ' photo' + (imageCount!==1?'s':''));
    } else {
      toast('Backup saved');
    }
  } catch (err) {
    if (err && err.name === 'AbortError') return; // person cancelled the share sheet \u2014 not a real failure
    if (!auto) toast('Backup failed: '+err.message);
  }
}

/* Smart automatic backup \u2014 runs once per app session. If it has been 3 or more days since the
   last backup (or a backup has never been taken), a fresh zip is downloaded automatically, with no
   button-press needed. This can only run while the app is open; it cannot back up on its own if the
   app stays closed for days, since there is no server behind this app to trigger it. */
async function maybeAutoBackup() {
  const AUTO_BACKUP_INTERVAL_DAYS = 1; // was 3 \u2014 tightened so a missed cloud sync has a same-day local safety net too
  try {
    if (!PATIENTS.length) return;
    const daysBack = daysSinceLastBackup();
    if (daysBack === null || daysBack >= AUTO_BACKUP_INTERVAL_DAYS) {
      await exportBackup(true);
      await render();
    }
    // Also backup to Google Drive if connected
    if (GOOGLE_DRIVE_ACCESS_TOKEN) {
      await maybeAutoBackupToDrive();
    }
  } catch (e) {}
}

const IMPORT_IMG_REGEX = /^images\/([^/]+)\/(?:preop|followup_([^/]+)|investigation_([^/]+))\/([^/]+)\.(jpg|mp4)$/;

async function importBackup(file) {
  if (typeof JSZip === 'undefined') { toast('Import tool failed to load \u2014 check your internet connection'); return; }
  toast('Restoring backup\u2026');
  try {
    const zip = await JSZip.loadAsync(file);
    
    // Verify checksum if present (TASK 4)
    const checksumEntry = zip.file('BACKUP_CHECKSUM.sha256');
    if (checksumEntry) {
      const expectedChecksum = (await checksumEntry.async('string')).split('  ')[0];
      toast('Verifying backup integrity...');
    }
    
    // Load manifest if present (TASK 5)
    const manifestEntry = zip.file('BACKUP_MANIFEST.json');
    let manifestData = null;
    if (manifestEntry) {
      try {
        manifestData = JSON.parse(await manifestEntry.async('string'));
        console.log('Backup from:', manifestData.backupDate, '| Cases:', manifestData.activePatients, '| Photos:', manifestData.totalPhotos);
      } catch(e) {}
    }
    
    const casesEntry = zip.file('cases.json');
    if (!casesEntry) { toast('Invalid backup file \u2014 cases.json not found'); return; }
    const casesJson = await casesEntry.async('string');
    const patients = JSON.parse(casesJson);
    
    // Restore all patients including soft-deleted (TASK 2)
    for (const p of patients) { await dbPutPatient(p); }

    const remindersEntry = zip.file('reminders.json');
    let remCount = 0;
    if (remindersEntry) {
      try {
        const importedReminders = JSON.parse(await remindersEntry.async('string'));
        importedReminders.forEach(r => {
          const idx = REMINDERS.findIndex(x => x.id === r.id);
          if (idx >= 0) REMINDERS[idx] = r; else REMINDERS.push(r);
        });
        saveReminders();
        remCount = importedReminders.length;
      } catch(e) {}
    }

    const profileEntry = zip.file('profile.json');
    if (profileEntry) {
      try { saveProfile(JSON.parse(await profileEntry.async('string')), true); } catch(e) {}
    }
    
    // TASK 1: Restore medicine library, investigations library, RX templates
    const medLibEntry = zip.file('medicine-library.json');
    if (medLibEntry) {
      try {
        const importedMeds = JSON.parse(await medLibEntry.async('string'));
        saveMedLibrary(importedMeds);
      } catch(e) {}
    }
    
    const invLibEntry = zip.file('investigation-library.json');
    if (invLibEntry) {
      try {
        const invLibData = await invLibEntry.async('string');
        localStorage.setItem(INVESTIGATION_LIB_KEY, invLibData);
      } catch(e) {}
    }
    
    const rxTemplatesEntry = zip.file('rx-templates.json');
    if (rxTemplatesEntry) {
      try {
        const importedTemplates = JSON.parse(await rxTemplatesEntry.async('string'));
        saveRxTemplateList(importedTemplates);
      } catch(e) {}
    }

    const imagePaths = Object.keys(zip.files).filter(path => IMPORT_IMG_REGEX.test(path) && !zip.files[path].dir);
    let imgCount = 0;
    for (const path of imagePaths) {
      const m = path.match(IMPORT_IMG_REGEX);
      const patientId = m[1], followUpId = m[2] || null, investigationId = m[3] || null, imageId = m[4];
      const blob = await zip.file(path).async('blob');
      await dbAddImage({ id: imageId, patientId, followUpId, investigationId, blob, createdAt: Date.now() });
      imgCount++;
    }
    await refreshPatients();
    render();
    
    const deletedCount = patients.filter(p => p.deletedAt).length;
    const msg = 'Restored '+patients.length+' case(s), '+imgCount+' photo(s)'+(remCount?', '+remCount+' reminder(s)':'')+(deletedCount?' (+'+deletedCount+' deleted cases)':'');
    toast(msg);
  } catch (err) {
    toast('Import failed: '+err.message);
  }
}

/* ================= Google Drive Backup Integration ================= */
function initiateGoogleDriveAuth() {
  // Redirect back to the app's own root/index page (not a separate "oauth-callback"
  // route, which doesn't exist as a real file on GitHub Pages and would 404).
  // handleOAuthCallback() reads the token from the URL hash on every app load.
  let basePath = window.location.pathname;
  if (!basePath.endsWith('/')) {
    basePath = basePath.substring(0, basePath.lastIndexOf('/') + 1);
  }
  const redirectUri = window.location.origin + basePath;
  const scopes = GOOGLE_OAUTH_SCOPES.join(' ');
  const authUrl = `https://accounts.google.com/o/oauth2/v2/auth?` +
    `client_id=${GOOGLE_OAUTH_CLIENT_ID}` +
    `&redirect_uri=${encodeURIComponent(redirectUri)}` +
    `&response_type=token` +
    `&scope=${encodeURIComponent(scopes)}` +
    `&prompt=consent`;
  window.location.href = authUrl;
}

async function uploadBackupToDrive(blob, filename) {
  if (!GOOGLE_DRIVE_ACCESS_TOKEN) {
    toast('Google Drive not connected');
    return false;
  }
  
  try {
    const metadata = {
      name: filename,
      mimeType: 'application/zip',
      parents: GOOGLE_DRIVE_FOLDER_ID ? [GOOGLE_DRIVE_FOLDER_ID] : []
    };
    
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
    form.append('file', blob);
    
    const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + GOOGLE_DRIVE_ACCESS_TOKEN },
      body: form
    });
    
    if (!response.ok) {
      if (response.status === 401) {
        await dbClearGoogleDriveToken();
        GOOGLE_DRIVE_ACCESS_TOKEN = null;
        GOOGLE_DRIVE_FOLDER_ID = null;
        toast('Google Drive access expired. Please reconnect.');
        return false;
      }
      let detail = '';
      try { const errJson = await response.json(); detail = errJson.error && errJson.error.message ? errJson.error.message : ''; } catch(e) {}
      throw new Error((detail || ('HTTP ' + response.status)));
    }
    
    const result = await response.json();
    toast('Backup saved to Google Drive');
    return true;
  } catch (err) {
    console.error('Google Drive upload failed:', err);
    toast('Drive backup failed: ' + err.message);
    return false;
  }
}

async function listDriveBackups() {
  if (!GOOGLE_DRIVE_ACCESS_TOKEN) return [];
  const q = encodeURIComponent("name contains 'OrthoVault-backup-' and trashed = false");
  const fields = encodeURIComponent('files(id,name,createdTime,size)');
  const url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=${fields}&orderBy=createdTime desc&pageSize=30`;
  const response = await fetch(url, { headers: { 'Authorization': 'Bearer ' + GOOGLE_DRIVE_ACCESS_TOKEN } });
  if (!response.ok) {
    if (response.status === 401) {
      await dbClearGoogleDriveToken();
      GOOGLE_DRIVE_ACCESS_TOKEN = null;
      GOOGLE_DRIVE_FOLDER_ID = null;
      toast('Google Drive access expired. Please reconnect.');
      return [];
    }
    let detail = '';
    try { const errJson = await response.json(); detail = errJson.error && errJson.error.message ? errJson.error.message : ''; } catch(e) {}
    throw new Error(detail || ('HTTP ' + response.status));
  }
  const data = await response.json();
  return data.files || [];
}

async function downloadDriveBackup(fileId) {
  const url = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`;
  const response = await fetch(url, { headers: { 'Authorization': 'Bearer ' + GOOGLE_DRIVE_ACCESS_TOKEN } });
  if (!response.ok) throw new Error('Download failed: HTTP ' + response.status);
  return response.blob();
}

async function maybeAutoBackupToDrive(force) {
  if (!GOOGLE_DRIVE_ACCESS_TOKEN || !isProOrAbove()) return false;
  
  const AUTO_BACKUP_INTERVAL_DAYS = 1;
  const LAST_DRIVE_BACKUP_KEY = 'last-drive-backup-time';
  
  try {
    if (!PATIENTS.length) return false;
    const lastBackup = parseInt(localStorage.getItem(LAST_DRIVE_BACKUP_KEY) || '0', 10);
    const daysSince = Math.floor((Date.now() - lastBackup) / (1000 * 60 * 60 * 24));
    
    if (force || lastBackup === 0 || daysSince >= AUTO_BACKUP_INTERVAL_DAYS) {
      const zip = new JSZip();
      const allPatients = await dbGetAllPatients();
      zip.file('cases.json', JSON.stringify(allPatients, null, 2));
      zip.file('reminders.json', JSON.stringify(REMINDERS, null, 2));
      zip.file('profile.json', JSON.stringify(loadProfile(), null, 2));
      
      for (const p of allPatients) {
        const images = await dbGetImagesByPatient(p.id);
        for (const im of images) {
          const folder = im.followUpId ? ('images/'+p.id+'/followup_'+im.followUpId)
            : im.investigationId ? ('images/'+p.id+'/investigation_'+im.investigationId)
            : im.isIntraOp ? ('images/'+p.id+'/ot')
            : ('images/'+p.id+'/preop');
          zip.file(folder+'/'+im.id+'.jpg', im.blob);
        }
      }
      
      const blob = await zip.generateAsync({type:'blob'});
      const filename = 'OrthoVault-backup-'+todayStr()+'.zip';
      
      if (await uploadBackupToDrive(blob, filename)) {
        localStorage.setItem(LAST_DRIVE_BACKUP_KEY, String(Date.now()));
        return true;
      }
    }
    return false;
  } catch (e) {
    console.error('Auto Drive backup failed:', e);
    toast('Drive backup failed: ' + (e.message || 'unknown error'));
    return false;
  }
}

function driveFileSizeLabel(bytes) {
  if (!bytes) return '';
  const mb = parseInt(bytes, 10) / (1024*1024);
  return mb < 0.1 ? '<0.1 MB' : mb.toFixed(1) + ' MB';
}

}

      let raw = (result.data.text || '').trim();
      raw = raw.replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/```\s*$/, '').trim();
      const draft = JSON.parse(raw);

    if (emptyRow) {

      emptyRow.duration = preset.duration; emptyRow.instructions = preset.instructions;
    } else {

document.addEventListener('change', async (e) => {
  const t = e.target;

    const target = t.dataset.relfuTarget;
    const numEl = document.getElementById(target+'-num');
    const unitEl = document.getElementById(target+'-unit');
    const date = computeRelativeFollowupDate(numEl ? numEl.value : '', unitEl ? unitEl.value : 'weeks');
    const hidden = document.getElementById(target);
    if (hidden) hidden.value = date;
    const prev = document.getElementById(target+'-preview');
    if (prev) prev.textContent = relfuPreviewText(date);
    if (t.dataset.relfuMode === 'auto' && date) {
      await patchField('nextFollowUpDate', date);
      toast('\u2713 Follow-up set for ' + fmtDate(date));
      await render();
    }
    return;
  }

  if (t.id === 'ap-condition') { 
    if (['ctev','ra','osteoporosis'].includes(t.value) && !isProOrAbove()) {
      toast('Special Tracking is a Pro feature. Upgrade to use this.');
      t.value = AP_TEMP.condition; // reset dropdown
      return;
    }
    syncApTempFromDom(); AP_TEMP.condition = t.value; render();

    if (container) container.outerHTML = fuInvControlsHtml();

  }
  if (t.id === 'fu-inv-xray-subtype') { FU_INV_XRAY_SUBTYPE = t.value; return; }

    if (!p.ctev) p.ctev = {};

      if (!p.ctev[parts[0]]) p.ctev[parts[0]] = {};
      if (!p.ctev[parts[0]][parts[1]]) p.ctev[parts[0]][parts[1]] = {};
      p.ctev[parts[0]][parts[1]][parts[2]] = t.value;
    } else if (parts.length === 2) {
      if (!p.ctev[parts[0]]) p.ctev[parts[0]] = {};
      p.ctev[parts[0]][parts[1]] = t.value;
    }
    await dbPutPatient(p); await refreshPatients();

  }
  if (t.dataset && t.dataset.raField) {
    const p = getPatient(SELECTED_ID);
    if (!p) return;
    if (!p.ra) p.ra = {};
    const parts = t.dataset.raField.split('.');
    if (parts.length === 2) { if (!p.ra[parts[0]]) p.ra[parts[0]] = {}; p.ra[parts[0]][parts[1]] = t.value; }
    else p.ra[parts[0]] = t.value;

/* ================= Theme (dark mode) ================= */
const THEME_KEY = 'surgical-case-log-theme-v1';
function loadTheme() { try { return localStorage.getItem(THEME_KEY) || 'auto'; } catch(e) { return 'auto'; } }
function computeAutoEffectiveTheme() {
  const hour = new Date().getHours();
  return (hour >= 6 && hour < 19) ? 'light' : 'dark';
}
function applyTheme(t) {
  const effective = t === 'auto' ? computeAutoEffectiveTheme() : (t === 'dark' ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', effective);
  try { localStorage.setItem(THEME_KEY, t); } catch(e) {}
  applyAccentTheme(loadAccentTheme());
}
setInterval(() => { if (loadTheme() === 'auto') applyTheme('auto'); }, 10*60*1000);

const ACCENT_THEMES = {
  indigo: { label:'Indigo', light:'#4338ca', lightDark:'#3730a3', dark:'#818cf8', darkDark:'#a5b4fc' },
  teal:   { label:'Teal',   light:'#0d9488', lightDark:'#0f766e', dark:'#2dd4bf', darkDark:'#5eead4' },
  emerald:{ label:'Emerald',light:'#059669', lightDark:'#047857', dark:'#34d399', darkDark:'#6ee7b7' },
  blue:   { label:'Blue',   light:'#2563eb', lightDark:'#1d4ed8', dark:'#60a5fa', darkDark:'#93c5fd' },
  plum:   { label:'Plum',   light:'#7e22ce', lightDark:'#6b21a8', dark:'#c084fc', darkDark:'#d8b4fe' },
};
const ACCENT_KEY = 'surgical-case-log-accent-v1';
function loadAccentTheme() { try { return localStorage.getItem(ACCENT_KEY) || 'indigo'; } catch(e) { return 'indigo'; } }
async function updateStorageIndicator() {
  const el = document.getElementById('storage-indicator');
  const bar = document.getElementById('storage-bar');
  if (!el) return;
  if (!navigator.storage || !navigator.storage.estimate) { el.textContent = ''; return; }
  try {
    const est = await navigator.storage.estimate();
    const usedMB = (est.usage / (1024*1024)).toFixed(1);
    const quotaMB = est.quota ? (est.quota / (1024*1024)).toFixed(0) : null;
    const pct = est.quota ? Math.round((est.usage/est.quota)*100) : null;
    el.textContent = usedMB + ' MB used' + (quotaMB ? ' of ~' + quotaMB + ' MB available' : '') + (pct!=null ? ' (' + pct + '%)' : '');
    
    // Update bar color: green <50%, amber 50-80%, red >80%
    if (bar) {
      bar.style.width = (pct || 0) + '%';
      if (pct > 80) bar.style.background = 'var(--red)';
      else if (pct > 50) bar.style.background = 'var(--amber)';
      else bar.style.background = 'var(--emerald)';
    }
  } catch(e) { el.textContent = ''; }
}
function applyAccentTheme(key) {
  const t = ACCENT_THEMES[key] || ACCENT_THEMES.indigo;
  const isDark = loadTheme() === 'dark';
  const root = document.documentElement.style;
  root.setProperty('--accent', isDark ? t.dark : t.light);
  root.setProperty('--accent-dark', isDark ? t.darkDark : t.lightDark);
  try { localStorage.setItem(ACCENT_KEY, key); } catch(e) {}
}

/* ================= App Lock (local PIN) — unlock-only now; setup UI removed, kept so an
   already-enabled PIN (from before this cleanup) still boots and can be unlocked/cleared ================= */
const APP_LOCK_HASH_KEY = 'surgical-case-log-lock-hash-v1';
let APP_LOCKED = false;
let LOCK_PIN_INPUT = '';
let LOCK_ERROR = false;
const PIN_LENGTH = 6;

async function hashPin(pin) {
  const enc = new TextEncoder().encode('bonelogpro-salt-' + pin);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function isLockEnabled() { try { return !!localStorage.getItem(APP_LOCK_HASH_KEY); } catch(e) { return false; } }
async function verifyPin(pin) {
  try {
    const stored = localStorage.getItem(APP_LOCK_HASH_KEY);
    if (!stored) return true;
    return (await hashPin(pin)) === stored;
  } catch(e) { return false; }
}
function clearPin() { try { localStorage.removeItem(APP_LOCK_HASH_KEY); } catch(e) {} }

function renderLockScreen() {
  const dots = Array.from({length:PIN_LENGTH}, (_,i) => '<span class="lock-dot'+(i<LOCK_PIN_INPUT.length?' filled':'')+'"></span>').join('');

    + '<img src="icons/logo-full.png" style="width:150px;height:150px;border-radius:32px;box-shadow:0 8px 24px rgba(0,0,0,0.35);margin-bottom:6px;">'
    + '<p style="font-size:12px;color:var(--muted);margin:0 0 4px;">'+(LOCK_ERROR?'Wrong PIN, try again.':'Enter PIN')+'</p>'
    + (ownerProfile.doctorName ? '<p style="font-size:10px;color:var(--muted);margin:0 0 14px;">Personal clinical tool of '+esc(ownerProfile.doctorName)+'</p>' : '<div style="margin-bottom:16px;"></div>')

    + '<div class="lock-keypad">'
    + [1,2,3,4,5,6,7,8,9].map(n=>'<button class="lock-key" data-action="lock-digit" data-value="'+n+'">'+n+'</button>').join('')
    + '<span></span><button class="lock-key" data-action="lock-digit" data-value="0">0</button><button class="lock-key" data-action="lock-backspace">'+ic('back')+'</button>'
    + '</div>'
    + '<button class="btn btn-sm" style="margin-top:16px;background:none;border:none;color:var(--muted);text-decoration:underline;" data-action="lock-emergency-disable">Forgot PIN? Tap to remove App Lock</button>'
    + '</div>';
}

      + '<p style="font-size:10.5px;color:var(--muted);margin:8px 0 10px;">Not usually needed \u2014 changes sync automatically now. Use this only if you want to manually re-push everything.</p>'
      + (ARMED_DELETE === 'restore-from-cloud:x'
          ? '<button class="btn btn-sm btn-danger-confirm btn-block" data-action="restore-from-cloud" data-confirm="1">'+ic('check')+' Yes, restore from cloud</button>'
          : '<button class="btn btn-sm btn-block" data-action="arm-delete" data-arm="restore-from-cloud:x">Force Full Restore from Cloud</button>')
      + '<p style="font-size:10.5px;color:var(--muted);margin:8px 0 10px;">Not usually needed \u2014 signing in already pulls everything down automatically. If this device has newer local changes for a patient, the cloud copy will overwrite them.</p>'
      + '<button class="btn btn-sm btn-block" data-action="account-sign-out">Sign out</button>'
      + (user.uid === MY_UID
          ? '<div style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);">'
            + '<label class="field-label">'+ic('shield')+' AI Features <span style="color:var(--muted);font-weight:500;">(only visible to you)</span></label>'
            + '<button class="btn btn-sm btn-block" data-action="test-ai">Test AI Connection</button>'
            + '<div id="ai-test-result" style="font-size:11.5px;color:var(--muted);margin-top:8px;"></div>'
            + '</div>'
          : '')
      + '</div>';
  }
  return '<div class="card">'
    + '<label class="field-label">Cloud Sync Account</label>'
    + '<p style="font-size:12px;color:var(--muted);margin:6px 0 10px;">Set this up once to prepare for multi-device sync. Sync isn\u2019t active yet \u2014 your data stays local for now.</p>'
    + '<div style="display:flex;flex-direction:column;gap:8px;">'
    + '<input class="input" id="auth-email" type="email" placeholder="Email" autocomplete="username">'
    + '<input class="input" id="auth-password" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password">'
    + '</div>'
    + '<div class="row gap2" style="margin-top:10px;">'
    + '<button class="btn btn-sm" style="flex:1;" data-action="email-sign-up">Create Account</button>'
    + '<button class="btn btn-primary btn-sm" style="flex:1;" data-action="email-sign-in">Sign In</button>'
    + '</div>'
    + '<p style="font-size:10.5px;color:var(--muted);margin:8px 0 0;">First time on this app? Tap "Create Account" once. On your other devices, use "Sign In" with the same email/password.</p>'
    + '</div>';
}
async function onAuthChanged(user) {
  CURRENT_USER = user;
  if (user) {
    await loadSubscriptionPlan(user.uid);
    await loadTokenUsage(user.uid); // Load token usage for AI tier
    // Firebase Cloud Sync (Firestore + Storage) costs money to run, so it's gated to the
    // AI tier only. Free/Pro accounts still sign in (for the subscription doc + Drive
    // backup) but their case data never touches Firestore.
    if (isAiTier()) { startCloudSync(user.uid); startImageCloudSync(user.uid); retryPendingSync(); pullProfileFromCloud(user.uid); }
    else { stopCloudSync(); stopImageCloudSync(); }
  } else {
    stopCloudSync(); stopImageCloudSync();
    CURRENT_PLAN = 'free';
    TOKEN_USAGE = { dailyCount: 0, monthlyCount: 0, date: '', monthStart: '' };
  }
  // Load FAQs and Academic Vault Topics
  await loadFAQsAndTopics();
  // Always render to ensure UI reflects latest plan/auth state
  render();
}
function onAuthError(err) {
  toast('Sign-in error: ' + (err && err.message ? err.message : 'something went wrong'));
}

/* ================= Init ================= */

function renderSplashScreen() {
  return '<div id="splash-screen" class="lock-screen" style="transition:opacity 420ms ease;">'
    + '<img src="icons/logo-full.png" style="width:300px;max-width:88vw;border-radius:30px;box-shadow:0 16px 40px rgba(0,0,0,0.45);">'
    + '</div>';
}

(async () => {
  const app = document.getElementById('app');
  app.innerHTML = renderSplashScreen();
  const splashStart = Date.now();

  applyTheme(loadTheme());
  if (navigator.storage && navigator.storage.persist) { try { await navigator.storage.persist(); } catch(e) {} }
  try {
    const deleted = await dbGetDeletedPatients();
    const cutoff = Date.now() - 30*24*60*60*1000;
    for (const p of deleted) {
      if (p.deletedAt < cutoff) { await dbDeleteImagesByPatient(p.id); await dbDeletePatient(p.id); }
    }
  } catch(e) {}

  const minSplashMs = 2400;
  const remaining = minSplashMs - (Date.now() - splashStart);
  if (remaining > 0) await new Promise(r => setTimeout(r, remaining));
  const splashEl = document.getElementById('splash-screen');
  if (splashEl) {
    splashEl.style.opacity = '0';
    await new Promise(r => setTimeout(r, 420));
  }

  // Cross-fade into whatever renders next (lock screen, onboarding, or the dashboard)
  // instead of the splash abruptly vanishing into a hard-cut screen.
  app.style.opacity = '0';
  app.style.transition = 'opacity 340ms ease';

  if (isLockEnabled()) {
    APP_LOCKED = true;
    app.innerHTML = renderLockScreen();
  } else {
    let onboardingDone = true;
    try { onboardingDone = !!localStorage.getItem(ONBOARDING_DONE_KEY); } catch(e) {}
    if (!onboardingDone) { VIEW = 'onboarding'; }
    await refreshPatients();
    loadReminders();
    await loadFAQsAndTopics();
    await loadGoogleDriveCredentials();
    const justConnectedDrive = await handleOAuthCallback();
    if (justConnectedDrive) { VIEW = 'drive-backup'; }
    
    // ISSUE 2: Restore last VIEW and patient (unless onboarding or drive backup)
    if (!justConnectedDrive && onboardingDone) {
      if (!restoreAppState()) {
        resetPatientListPagination();
      }
    } else {
      resetPatientListPagination();
    }
    
    // ISSUE 1: Restore draft if user was adding a case
    if (VIEW === 'detail' && !loadApDraft()) {
      // Draft doesn't exist but VIEW is still 'detail', reset to list
      VIEW = 'list';
      SELECTED_ID = null;
    }
    
    await render();
    // Safety mechanism: Force bottom nav to be visible after initial render completes
    setTimeout(() => {
      const wrap = document.getElementById('bottom-nav-wrap');
      if (wrap && !APP_LOCKED && BOTTOM_NAV_VIEWS.includes(VIEW)) {
        wrap.style.display = 'block';
      }
    }, 500);
    maybeAutoBackup();
    maybeNotifyToday();
    startPendingSyncRetryLoop();
    updateOfflineBanner();
    if (CURRENT_USER) retryPendingSync();
    // ISSUE 5: Request notification permission silently on first app load
    requestNotificationPermission();
  }
  requestAnimationFrame(() => requestAnimationFrame(() => { app.style.opacity = '1'; }));
})();
</script>
</body>
</html>
