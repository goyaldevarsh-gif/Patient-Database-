<script>
  /* ================= Firebase (Auth + Firestore + Storage) ================= */
  const firebaseConfig = {
    apiKey: "AIzaSyAehCjdYB6sHZN5Hdw7kTiy2L5dtOPfqWA",
    authDomain: "orthovault02.firebaseapp.com",
    projectId: "orthovault02",
    storageBucket: "orthovault02.firebasestorage.app",
    messagingSenderId: "251974181391",
    appId: "1:251974181391:web:348e0e07d0e53ec672f97a",
    measurementId: "G-NRDTY5SCV1"
  };
  // These MUST always be declared (even if Firebase itself fails to load, e.g. offline
  // with the CDN scripts not yet cached) \u2014 everything downstream checks CURRENT_USER
  // before touching firestoreDB/etc., but a ReferenceError from an undeclared variable
  // would crash the whole app's startup, not just the cloud features. Local-only use
  // must keep working even when Firebase never initializes.
  let firestoreDB = null, firebaseStorage = null, firebaseFunctions = null;
  // Only this account sees AI-feature UI. Must match the ALLOWED_UIDS
  // entry in the Cloud Function - find your UID in Firebase Console ->
  // Authentication -> Users. This is a UX nicety only; the real gate
  // is server-side in the Cloud Function itself.
  const MY_UID = 'oc3eOgkVgqQ200UoswTzEH1Feuh1';
  let CURRENT_USER = null;
  try {
    firebase.initializeApp(firebaseConfig);
    firestoreDB = firebase.firestore();
    firebaseStorage = firebase.storage();
    firebaseFunctions = firebase.app().functions('asia-south2');
    firebase.auth().onAuthStateChanged(function(user) {
      CURRENT_USER = user;
      if (typeof onAuthChanged === 'function') onAuthChanged(user);
    });
  } catch (e) {
    console.error('Firebase failed to initialize (likely offline) \u2014 continuing in local-only mode', e);
  }

  /* ================= Subscription / Entitlement (client-side UX gate; source of
     truth is the Firestore doc, server-verified once Play Billing is wired up) ================= */
  let CURRENT_PLAN = 'free'; // 'free' | 'pro' | 'ai' \u2014 default until the Firestore doc is fetched
  function isAiTier() { return !!(CURRENT_USER && (CURRENT_USER.uid === MY_UID || CURRENT_PLAN === 'ai')); }
  function isProOrAbove() { return !!(CURRENT_USER && (CURRENT_USER.uid === MY_UID || CURRENT_PLAN === 'pro' || CURRENT_PLAN === 'ai')); }
  async function loadSubscriptionPlan(uid) {
    try {
      const doc = await firestoreDB.collection('users').doc(uid).collection('meta').doc('subscription').get();
      if (doc.exists && doc.data().plan) { CURRENT_PLAN = doc.data().plan; return; }
      // No subscription doc yet: bootstrap one. The owner account gets 'ai' by
      // default (matches the old MY_UID-only behaviour); everyone else starts 'free'.
      const defaultPlan = (uid === MY_UID) ? 'ai' : 'free';
      await firestoreDB.collection('users').doc(uid).collection('meta').doc('subscription').set({ plan: defaultPlan, updatedAt: Date.now() });
      CURRENT_PLAN = defaultPlan;
    } catch (e) {
      console.error('Could not load subscription plan:', e);
      CURRENT_PLAN = 'free';
    }
  }

  async function loadTokenUsage(uid) {
    if (!isAiTier()) return; // Only AI tier has token limits
    try {
      const doc = await firestoreDB.collection('users').doc(uid).collection('meta').doc('tokenUsage').get();
      const today = new Date().toISOString().split('T')[0];
      const monthStart = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().split('T')[0];
      
      if (doc.exists) {
        const data = doc.data();
        // Reset daily if new day
        if (data.date !== today) {
          TOKEN_USAGE = { dailyCount: 0, monthlyCount: data.monthlyCount || 0, date: today, monthStart };
        }
        // Reset monthly if new month
        else if (data.monthStart !== monthStart) {
          TOKEN_USAGE = { dailyCount: data.dailyCount || 0, monthlyCount: 0, date: today, monthStart };
        } else {
          TOKEN_USAGE = data;
        }
      } else {
        TOKEN_USAGE = { dailyCount: 0, monthlyCount: 0, date: today, monthStart };
      }
    } catch (e) {
      console.error('Could not load token usage:', e);
      TOKEN_USAGE = { dailyCount: 0, monthlyCount: 0, date: '', monthStart: '' };
    }
  }

  async function canUseAI() {
    if (!isAiTier()) { toast('AI features are for AI tier. Upgrade to enable.'); return false; }
    if (TOKEN_USAGE.dailyCount >= DAILY_LIMIT) { toast('Daily token limit (15,000) reached. Resets tomorrow.'); return false; }
    if (TOKEN_USAGE.monthlyCount >= MONTHLY_LIMIT) { toast('Monthly token limit (100,000) reached. Resets next month.'); return false; }
    return true;
  }

  async function logTokenUsage(uid, inputTokens, outputTokens) {
    if (!isAiTier()) return;
    try {
      const totalTokens = (inputTokens || 0) + (outputTokens || 0);
      const today = new Date().toISOString().split('T')[0];
      const monthStart = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().split('T')[0];
      
      TOKEN_USAGE.dailyCount = (TOKEN_USAGE.dailyCount || 0) + totalTokens;
      TOKEN_USAGE.monthlyCount = (TOKEN_USAGE.monthlyCount || 0) + totalTokens;
      TOKEN_USAGE.date = today;
      TOKEN_USAGE.monthStart = monthStart;
      
      await firestoreDB.collection('users').doc(uid).collection('meta').doc('tokenUsage').set(TOKEN_USAGE);
    } catch (e) {
      console.error('Could not log token usage:', e);
    }
  }

  /* ================= Google Drive OAuth ================= */
  const GOOGLE_OAUTH_CLIENT_ID = '251974181391-v1jhmhqu5m77cjrrh2i45aj4l2bgm5oj.apps.googleusercontent.com';
  const GOOGLE_OAUTH_SCOPES = ['https://www.googleapis.com/auth/drive.file'];
  let GOOGLE_DRIVE_ACCESS_TOKEN = null;
  let GOOGLE_DRIVE_FOLDER_ID = null;

  /* Check for OAuth callback on app load */
  async function handleOAuthCallback() {
    const params = new URLSearchParams(window.location.hash.substring(1));
    const accessToken = params.get('access_token');
    if (accessToken) {
      GOOGLE_DRIVE_ACCESS_TOKEN = accessToken;
      try {
        await dbSaveGoogleDriveToken(accessToken);
        window.location.hash = '';
        toast('Google Drive connected!');
        return true;
      } catch (e) {
        console.error('Error saving token:', e);
        toast('Connection failed. Please try again.');
        return false;
      }
    }
    return false;
  }

  // Load stored Google Drive credentials on app start
  async function loadGoogleDriveCredentials() {
    try {
      const db = await openIndexedDB();
      const tx = db.transaction('settings', 'readonly');
      const store = tx.objectStore('settings');
      const result = await new Promise((resolve, reject) => {
        const req = store.get('google_drive');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      if (result) {
        GOOGLE_DRIVE_ACCESS_TOKEN = result.accessToken;
        GOOGLE_DRIVE_FOLDER_ID = result.folderId;
      }
    } catch (e) {
      console.error('Error loading Google Drive credentials:', e);
    }
  }
</script>

  .input, .textarea, .select { width:100%; border:1px solid var(--border); border-radius:10px; padding:9px 11px; background:#fff; color:var(--ink); }
  .input:focus, .textarea:focus, .select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 2px rgba(67,56,202,0.15); }
  .textarea { resize:vertical; }

  .seg { display:flex; gap:6px; }
  .seg-btn { flex:1; border:1px solid var(--border); border-radius:8px; padding:9px; font-weight:700; font-size:12px; background:#fff; color:var(--muted); }
  .seg-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }

  .thumb-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
  .thumb-wrap { position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; border:1px solid var(--border); background:var(--bg-soft); contain:layout style paint; will-change:transform; }
  .thumb-date { position:absolute; left:0; right:0; bottom:0; background:rgba(15,23,42,0.72); color:#fff; font-size:9px; font-weight:700; text-align:center; padding:2px 3px; }
  .accent-swatch { width:34px; height:34px; border-radius:50%; border:2px solid transparent; flex:none; }
  .accent-swatch.active { border-color:var(--ink); box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--ink); }
  [data-theme="dark"] .accent-swatch.active { box-shadow:0 0 0 2px #0f172a, 0 0 0 4px var(--ink); }
  .thumb-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb-remove { position:absolute; top:3px; right:3px; background:rgba(15,23,42,0.75); color:#fff; border:none; border-radius:999px; width:20px; height:20px; font-size:12px; line-height:1; }
  .thumb-label { position:absolute; bottom:0; left:0; right:0; background:rgba(15,23,42,0.65); color:#fff; font-size:9px; padding:2px 5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .add-photo-tile { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; aspect-ratio:1; border-radius:10px; border:2px dashed #c7d2fe; color:var(--accent-dark); font-size:10px; font-weight:700; background:#f5f6ff; }
  .cam-fab { position:absolute; top:-9px; right:-9px; width:36px; height:36px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 10px rgba(67,56,202,0.4); border:2px solid #fff; z-index:2; }
  .cam-fab .ic { width:16px; height:16px; }
  [data-theme="dark"] .cam-fab { border-color:#0f172a; }

  .tabs { display:flex; overflow-x:auto; border-top:1px solid #f1f5f9; }
  .tabs-wrap { position:relative; }
  .tabs-wrap::after { content:''; position:absolute; right:0; top:1px; bottom:0; width:22px; background:linear-gradient(to right, transparent, rgba(255,255,255,0.96)); pointer-events:none; }
  [data-theme="dark"] .tabs-wrap::after { background:linear-gradient(to right, transparent, rgba(15,23,42,0.96)); }
  .tab { flex-shrink:0; display:flex; align-items:center; gap:6px; padding:11px 13px; border-bottom:2px solid transparent; color:var(--muted); font-weight:700; font-size:12px; background:none; border-left:none; border-right:none; border-top:none; }
  .tab.active { border-bottom-color:var(--accent); color:var(--accent-dark); }

  .stat-card { border:1px solid var(--border); border-radius:20px; padding:12px; background:#fff; }
  .dash-tile { flex:1; border-radius:16px; padding:9px 8px; text-align:center; border:1px solid; box-shadow:0 1px 3px rgba(15,23,42,0.05); transition:transform 0.12s ease, box-shadow 0.12s ease; }
  button.dash-tile:active { transform:scale(0.97); box-shadow:0 1px 2px rgba(15,23,42,0.06); }
  .dash-tile .di { display:flex; align-items:center; justify-content:center; margin-bottom:2px; opacity:0.9; transform:scale(0.85); }
  .dash-tile .dv { font-size:17px; font-weight:800; font-family:'JetBrains Mono',monospace; line-height:1.1; }
  .dash-tile .dl { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; margin-top:2px; opacity:0.85; }
  .backup-banner { display:flex; align-items:center; gap:10px; border-radius:20px; padding:10px 12px; background:var(--amber-bg); border:1px solid var(--amber-border); margin-bottom:12px; }
  .insight-row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:12px; border-bottom:1px solid var(--border); }
  .insight-row:last-child { border-bottom:none; }
  .mic-btn { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:50%; border:1px solid var(--border); background:#fff; color:var(--muted); flex-shrink:0; }
  .mic-btn.recording { background:var(--red); border-color:var(--red); color:#fff; animation: mic-pulse 1.1s infinite; }
  .speak-btn.speaking { background:var(--accent); color:#fff; animation: mic-pulse 1.1s infinite; }
  @keyframes mic-pulse { 0%{box-shadow:0 0 0 0 rgba(185,28,28,0.4);} 70%{box-shadow:0 0 0 8px rgba(185,28,28,0);} 100%{box-shadow:0 0 0 0 rgba(185,28,28,0);} }
  .textarea-with-mic { position:relative; }
  .tag-chip { display:inline-flex; align-items:center; gap:4px; border-radius:999px; border:1px solid var(--border); background:#fff; color:var(--muted); padding:5px 10px; font-size:11px; font-weight:600; }
  .tag-chip.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .tag-chip-x { display:inline-flex; }
  .stat-label { font-size:11px; font-weight:700; text-transform:uppercase; color:var(--muted); }
  .stat-value { font-size:16px; font-weight:800; margin-top:4px; }

  .empty-state { display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; margin-top:56px; padding:0 24px; color:#64748b; }
  .empty-icon-wrap { background:#eef2ff; border-radius:999px; padding:18px; color:var(--accent); margin-bottom:4px; }

  .fu-card { border:1px solid var(--border); border-radius:20px; padding:12px 14px; margin-bottom:10px; }
  .tl-row { display:flex; gap:12px; position:relative; padding-bottom:20px; }
  .tl-row:last-child { padding-bottom:0; }
  .tl-row::before { content:''; position:absolute; left:15px; top:32px; bottom:0; width:2px; background:var(--border); }
  .tl-row:last-child::before { display:none; }
  .tl-dot { flex-shrink:0; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; z-index:1; }
  .tl-content { flex:1; padding-top:4px; cursor:pointer; }
  .tl-date { font-size:10px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.02em; }
  .tl-title { font-size:13px; font-weight:700; color:var(--ink); margin-top:2px; }
  .tl-sub { font-size:12px; color:#64748b; margin-top:2px; }
  .overdue-note { font-size:11px; font-weight:700; color:var(--red); margin-top:3px; display:flex; align-items:center; gap:4px; }
  .bottom-bar { position:sticky; bottom:0; border-top:1px solid var(--border); background:#fff; padding:10px 12px; padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px)); display:flex; gap:8px; }

  /* UX7: Modal Animations - slide-up on mobile, slide-from-right on desktop */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; overflow:hidden; touch-action:none; animation:modal-slide-up 0.35s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes modal-slide-up { from { opacity:0; transform:translateY(40px); } to { opacity:1; transform:translateY(0); } }
  @media (min-width: 1024px) {
    .modal-overlay { animation:modal-slide-right 0.35s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes modal-slide-right { from { opacity:0; transform:translateX(60px); } to { opacity:1; transform:translateX(0); } }
  }
  .modal-overlay img { max-width:100%; max-height:78vh; border-radius:8px; }
  .modal-bar { position:absolute; top:calc(16px + env(safe-area-inset-top, 0px)); left:16px; right:16px; display:flex; align-items:center; justify-content:space-between; gap:8px; z-index:2; }
  .modal-btn { background:rgba(255,255,255,0.12); color:#fff; border:none; border-radius:999px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; }
  .modal-nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,0.12); color:#fff; border:none; border-radius:999px; width:40px; height:40px; display:flex; align-items:center; justify-content:center; z-index:2; }
  .modal-nav-prev { left:12px; }
  .modal-nav-next { right:12px; }
  .modal-note-bar { position:absolute; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); z-index:2; }
  .modal-note-bar .input { background:rgba(255,255,255,0.96); }
  .img-note-caption { position:absolute; top:calc(64px + env(safe-area-inset-top, 0px)); left:16px; right:16px; z-index:2; background:rgba(245,158,11,0.95); color:#1e293b; font-weight:700; font-size:13px; padding:10px 14px; border-radius:10px; box-shadow:0 4px 14px rgba(0,0,0,0.25); display:flex; align-items:flex-start; gap:6px; }
  .modal-label { color:#fff; font-size:12px; margin-top:10px; opacity:0.8; }

  .toast { position:fixed; bottom:14px; left:50%; transform:translateX(-50%) translateY(0); z-index:40; background:rgba(15,23,42,0.94); color:#fff; font-size:12px; font-weight:600; padding:8px 16px; border-radius:999px; opacity:1; transition:opacity 200ms ease, transform 200ms ease; max-width:90vw; overflow:hidden; text-overflow:ellipsis; white-space:normal; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .toast.toast-hidden { opacity:0; transform:translateX(-50%) translateY(6px); pointer-events:none; }

  .ocr-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.55); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); z-index:60; display:flex; align-items:flex-end; justify-content:center; }
  .ocr-card { background:var(--bg,#fff); width:100%; max-width:520px; max-height:88vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); box-shadow:0 -8px 30px rgba(0,0,0,0.25); }
  [data-theme="dark"] .ocr-card { background:#1e293b; }
  .ocr-row { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); }
  .ocr-row:last-of-type { border-bottom:none; }

  .rx-sheet { max-width:520px; margin:0 auto; padding:22px 18px 40px; font-family:'Inter',sans-serif; color:#111827; }
  .rx-letterhead { display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #1e293b; padding-bottom:12px; margin-bottom:14px; }
  .rx-clinic-name { font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:16px; }
  .rx-clinic-addr { font-size:11px; color:#475569; line-height:1.5; }
  .rx-doc-name { font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:14px; }
  .rx-patient-row { display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; }
  .rx-diagnosis { font-size:12px; color:#475569; font-style:italic; margin-bottom:14px; }
  .rx-symbol { font-family:'Plus Jakarta Sans',sans-serif; font-size:22px; font-weight:800; font-style:italic; margin:6px 0 8px; }
  .rx-table { width:100%; border-collapse:collapse; margin-bottom:16px; }
  .rx-table td { padding:8px 4px; vertical-align:top; border-bottom:1px solid #f1f5f9; font-size:13px; }
  .rx-num { width:22px; font-weight:700; color:#64748b; }
  .rx-sub { font-size:12px; color:#64748b; }
  .rx-advice { font-size:12px; margin-bottom:8px; line-height:1.5; }
  .rx-sign { margin-top:50px; text-align:right; font-size:12px; color:#334155; }

  /* ---- Patient education handout: its own editorial identity ---- */
  :root {
    --edu-ink:#16302E; --edu-bg:#F6F9F8; --edu-muted:#5C7572;
    --edu-teal:#0F6E63; --edu-teal-light:#E7F2F0; --edu-teal-border:#BFDDD8;
    --edu-gold:#A9761F; --edu-gold-light:#FBF3E3; --edu-gold-border:#EAD3A0;
    --edu-red:#A8362E; --edu-red-light:#FCEEEC; --edu-red-border:#F0C4BE;
  }
  .edu-doc { max-width:520px; margin:0 auto; background:var(--edu-bg); font-family:'Inter',sans-serif; color:var(--edu-ink); padding-bottom:24px; }
  .edu-header-band { background:var(--edu-teal); color:#fff; padding:9px 22px; display:flex; justify-content:space-between; align-items:center; font-size:10px; letter-spacing:0.02em; }
  .edu-hero { padding:26px 22px 16px; }
  .edu-eyebrow { font-size:11px; font-weight:700; letter-spacing:0.13em; text-transform:uppercase; color:var(--edu-gold); margin-bottom:8px; }
  .edu-title { font-family:'Fraunces',serif; font-weight:600; font-size:29px; line-height:1.18; color:var(--edu-teal); margin:0 0 12px; }
  .edu-tier-legend { display:flex; gap:16px; margin-bottom:14px; font-size:10px; color:var(--edu-muted); flex-wrap:wrap; }
  .edu-tier-legend b { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; }
  .edu-patient-line { font-size:12px; color:var(--edu-muted); padding-top:12px; border-top:1px solid var(--edu-teal-border); }

  .edu-section { margin:0 22px 14px; padding:16px 18px; border-radius:20px; border-left:4px solid; }
  .edu-section.info { background:var(--edu-teal-light); border-color:var(--edu-teal); }
  .edu-section.action { background:var(--edu-gold-light); border-color:var(--edu-gold); }
  .edu-section.urgent { background:var(--edu-red-light); border-color:var(--edu-red); }
  .edu-section-label { font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:16px; margin-bottom:8px; }
  .edu-section.info .edu-section-label { color:var(--edu-teal); }
  .edu-section.action .edu-section-label { color:var(--edu-gold); }
  .edu-section.urgent .edu-section-label { color:var(--edu-red); }
  .edu-section-body { font-size:13px; line-height:1.6; }
  .edu-section-body + .edu-section-body { margin-top:8px; }
  .edu-checklist { list-style:none; margin:0; padding:0; }
  .edu-checklist li { display:flex; gap:8px; align-items:flex-start; margin-bottom:8px; font-size:13px; line-height:1.45; }
  .edu-checklist li:last-child { margin-bottom:0; }
  .edu-checklist li svg { flex-shrink:0; margin-top:2px; width:15px; height:15px; }
  .edu-section.action .edu-checklist svg { color:var(--edu-gold); }
  .edu-section.urgent .edu-checklist svg { color:var(--edu-red); }
  .edu-footer { margin:20px 22px 0; padding-top:12px; border-top:1px solid var(--edu-teal-border); font-size:10px; color:var(--edu-muted); display:flex; justify-content:space-between; }

  .edu-img-doc { max-width:600px; margin:0 auto; }
  .edu-img-strip { display:flex; justify-content:space-between; align-items:center; padding:10px 16px; background:#0f2a4a; color:#fff; font-size:12px; }
  .edu-img-strip .mono { color:#93c5fd; }

  .edu-hi { color:var(--edu-muted); margin-top:2px; }
  .edu-subhead { font-weight:700; font-size:12px; color:var(--edu-gold); text-transform:uppercase; letter-spacing:0.04em; margin:14px 0 6px; }
  .edu-subhead:first-child { margin-top:0; }
  .edu-cross { flex-shrink:0; margin-top:1px; width:15px; height:15px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; color:var(--edu-red); }
  .edu-quote { margin:18px 22px; padding:18px 20px; background:#fff; border-radius:20px; border:1px solid var(--edu-teal-border); text-align:center; }
  .edu-quote-en { font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:16px; color:var(--edu-teal); line-height:1.4; }
  .edu-quote-hi { font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:14px; color:var(--edu-muted); margin-top:8px; line-height:1.4; }

  @media print {
    .no-print, .sticky-top, .toast { display:none !important; }
    #app { max-width:none; }
    body { background:#fff; }
    .edu-doc { max-width:none; }
    .edu-img-doc { max-width:none; page-break-after:always; }
  }

  /* ---- Dark mode (print/education handouts deliberately excluded -- always light for printing/sharing) ---- */
  [data-theme="dark"] {
    --ink:#e2e8f0; --muted:#94a3b8; --border:#334155; --bg:#0f172a; --bg-soft:#1e293b;
    --accent:#818cf8; --accent-dark:#a5b4fc; --accent-bg:#312e81; --accent-border:#4338ca;
    --amber:#fbbf24; --amber-bg:#3f2d05; --amber-border:#78350f;
    --orange:#fb923c; --orange-bg:#431407; --orange-border:#7c2d12;
    --emerald:#34d399; --emerald-bg:#022c22; --emerald-border:#065f46;
    --red:#f87171; --red-bg:#450a0a; --red-border:#7f1d1d;
    --slate:#94a3b8; --slate-bg:#1e293b; --slate-border:#334155;
  }
  [data-theme="dark"] .badge-indigo { color:#c7d2fe; background:#312e81; border-color:#4338ca; }
  [data-theme="dark"] .badge-muted { color:#94a3b8; background:#1e293b; border-color:#334155; }
  [data-theme="dark"] html, [data-theme="dark"] body { background:#0f172a; color:var(--ink); }
  [data-theme="dark"] #app { background:#0f172a; }
  [data-theme="dark"] .card, [data-theme="dark"] .case-card, [data-theme="dark"] .stat-card,
  [data-theme="dark"] .fu-card, [data-theme="dark"] .patient-card, [data-theme="dark"] .dash-tile,
  [data-theme="dark"] .btn, [data-theme="dark"] .chip, [data-theme="dark"] .seg-btn,
  [data-theme="dark"] .scorer-btn, [data-theme="dark"] .mic-btn, [data-theme="dark"] .tag-chip,
  [data-theme="dark"] .input, [data-theme="dark"] .textarea, [data-theme="dark"] .select {
    background:#1e293b !important; color:var(--ink); border-color:var(--border);
  }
  [data-theme="dark"] .sticky-top, [data-theme="dark"] .bottom-bar { background:rgba(15,23,42,0.97) !important; backdrop-filter:blur(6px); border-color:var(--border); }
  [data-theme="dark"] .seg-btn.active, [data-theme="dark"] .chip.active, [data-theme="dark"] .tab.active { background:var(--accent) !important; border-color:var(--accent) !important; color:#0f172a !important; }
  [data-theme="dark"] .section-sticky-label { color:#0f172a; }
  [data-theme="dark"] .pcard-action-btn.wa { color:#4ade80; }
  [data-theme="dark"] .btn-primary { background:var(--accent) !important; border-color:var(--accent) !important; color:#0f172a; box-shadow:none; }
  [data-theme="dark"] .btn-primary .ic { stroke:#0f172a; }
  [data-theme="dark"] [style*="c7d2fe"] { background:rgba(129,140,248,0.1) !important; border-color:#4338ca !important; }
  [data-theme="dark"] [style*="25D366"] { background:#128c3e !important; border-color:#128c3e !important; }
  [data-theme="dark"] .scorer-group { background:rgba(30,41,59,0.7); }
  [data-theme="dark"] .help-box { background:#1e2452; border-color:#3730a3; color:#c7d2fe; }
  [data-theme="dark"] .thumb-wrap { background:var(--bg-soft); }
  [data-theme="dark"] .add-photo-tile { background:#1e2452; border-color:#3730a3; color:#a5b4fc; }
  [data-theme="dark"] .empty-state { color:var(--muted); }
  [data-theme="dark"] .backup-banner { background:#3f2d05; border-color:#78350f; }
  [data-theme="dark"] .cspine-alert { background:#450a0a; border-color:#7f1d1d; }
  [data-theme="dark"] .search-input, [data-theme="dark"] .search-wrap { background:#1e293b; color:var(--ink); }
  [data-theme="dark"] .tab { color:var(--muted); }
  [data-theme="dark"] .icon-btn { color:var(--accent); }

  .lock-screen { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; background:#0f172a; color:#fff; }
  .lock-icon { width:56px; height:56px; border-radius:50%; background:#1e293b; display:flex; align-items:center; justify-content:center; color:#818cf8; }
  .lock-icon svg { width:26px; height:26px; }
  .lock-dots { display:flex; gap:14px; margin-bottom:26px; }
  .lock-dot { width:14px; height:14px; border-radius:50%; border:1.5px solid #475569; }
  .lock-dot.filled { background:#818cf8; border-color:#818cf8; }
  .lock-keypad { display:grid; grid-template-columns:repeat(3,64px); gap:14px; }
  .lock-key { width:64px; height:64px; border-radius:50%; border:1px solid #334155; background:#1e293b; color:#fff; font-size:20px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .lock-key svg { width:20px; height:20px; }
  @keyframes lock-shake { 0%,100%{transform:translateX(0);} 20%,60%{transform:translateX(-8px);} 40%,80%{transform:translateX(8px);} }
  .pin-setup-dots { display:flex; gap:10px; justify-content:center; margin:10px 0; }
  .pin-setup-dots .lock-dot { width:11px; height:11px; border-color:var(--border); }
  .pin-setup-dots .lock-dot.filled { background:var(--accent); border-color:var(--accent); }
  .pin-setup-keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:260px; margin:14px auto 0; }
  .pin-setup-keypad .lock-key { width:100%; height:52px; border-radius:12px; background:var(--bg-soft); color:var(--ink); border-color:var(--border); }

  .compare-pick-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .compare-pick-item { position:relative; border:2px solid var(--border); border-radius:12px; overflow:hidden; padding:0; background:none; aspect-ratio:1; }
  .compare-pick-item.selected { border-color:var(--accent); }
  .compare-pick-item img { width:100%; height:100%; object-fit:cover; display:block; }
  .compare-pick-badge { position:absolute; top:6px; right:6px; background:var(--accent); color:#fff; font-size:10px; font-weight:800; padding:3px 8px; border-radius:999px; }
  .compare-pick-label { position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.6); color:#fff; font-size:10px; padding:4px 6px; text-align:left; }
  .compare-split { display:flex; flex-direction:column; min-height:calc(100vh - 60px); }
  .compare-half { flex:1; position:relative; display:flex; align-items:center; justify-content:center; background:#000; overflow:hidden; }
  .compare-half img { width:100%; height:100%; object-fit:contain; }
  .compare-tag { position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.65); color:#fff; font-size:11px; font-weight:800; letter-spacing:0.03em; padding:5px 10px; border-radius:999px; z-index:2; }

  .cal-dow-row { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:10px; font-weight:700; color:var(--muted); margin-bottom:4px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-cell { aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-radius:8px; border:1px solid transparent; background:none; }
  .cal-daynum { font-size:12px; font-weight:600; }
  .cal-today .cal-daynum { color:var(--accent); font-weight:800; }
  .cal-selected { border-color:var(--accent); background:rgba(67,56,202,0.06); }
  .cal-dots { display:flex; align-items:center; gap:4px; height:12px; }
  .cal-dot { display:inline-flex; align-items:center; justify-content:center; min-width:14px; height:14px; padding:0 3px; border-radius:999px; font-size:9px; font-weight:800; background:var(--accent); color:#fff; }
  .cal-dot-overdue { background:var(--red); }
  .cal-dot-rem { min-width:6px; width:6px; height:6px; padding:0; background:var(--amber); }
  .reminder-check { width:26px; height:26px; border-radius:50%; border:2px solid var(--border); background:#fff; flex:none; display:flex; align-items:center; justify-content:center; color:#fff; margin-top:1px; }
  .reminder-check .ic { width:13px; height:13px; }
  .reminder-check.done { background:var(--emerald); border-color:var(--emerald); }

  .usearch-fab { position:absolute; right:16px; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); width:42px; height:42px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 10px rgba(67,56,202,0.3); border:none; opacity:0.82; }
  .usearch-fab .ic { width:18px; height:18px; }
  .side-back-btn { position:absolute; left:8px; top:50%; transform:translateY(-50%); width:32px; height:32px; border-radius:50%; background:rgba(15,23,42,0.5); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,0.15); border:none; }
  .side-back-btn .ic { width:15px; height:15px; }
  .usearch-overlay { position:fixed; inset:0; background:rgba(255,255,255,0.85); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); z-index:70; display:flex; flex-direction:column; }
  [data-theme="dark"] .usearch-overlay { background:rgba(15,23,42,0.9); }
  .usearch-topbar { display:flex; align-items:center; gap:8px; padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top, 0px)); border-bottom:1px solid var(--border); }
  .usearch-results { flex:1; overflow-y:auto; padding:8px 16px 24px; }
  [data-theme="dark"] .reminder-check { background:#1e293b; }
  
  /* ================= Dark Mode: New Premium Features ================= */
  [data-theme="dark"] .confirm-dialog-overlay { background: rgba(0, 0, 0, 0.8); }
  [data-theme="dark"] .confirm-dialog { background: #1e293b; color: #f1f5f9; }
  [data-theme="dark"] .confirm-dialog-title { color: #f1f5f9; }
  [data-theme="dark"] .confirm-dialog-message { color: #94a3b8; }
  [data-theme="dark"] .confirm-btn-cancel { background: #0f172a; color: #f1f5f9; border-color: #334155; }
  [data-theme="dark"] .confirm-btn-destructive { background: #991b1b; color: #fecaca; }
  [data-theme="dark"] .skeleton-line, [data-theme="dark"] .skeleton-header { background: linear-gradient(90deg, #334155 0%, #475569 50%, #334155 100%); }
  [data-theme="dark"] input.valid, [data-theme="dark"] textarea.valid, [data-theme="dark"] select.valid { border-color: #10b981; background-color: rgba(16, 185, 129, 0.05); }
  [data-theme="dark"] input.invalid, [data-theme="dark"] textarea.invalid, [data-theme="dark"] select.invalid { border-color: #ef4444; background-color: rgba(239, 68, 68, 0.05); }
  [data-theme="dark"] .expandable-section { color: #e2e8f0; }
  .bottom-nav { display:flex; align-items:stretch; background:var(--bg,#fff); border-top:1px solid var(--border); padding:6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); box-shadow:0 -2px 10px rgba(15,23,42,0.06); position:relative; }
  .bottom-nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; background:none; border:none; padding:6px 2px; color:var(--muted); font-size:10px; font-weight:700; }
  .bottom-nav-btn.active { color:var(--accent); }
  .bottom-nav-btn .ic { width: 24px; height: 24px; }
  .bottom-nav-add-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .bottom-nav-add-circle { width:56px; height:56px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px rgba(67,56,202,0.4); margin-top:-30px; border:4px solid var(--bg,#fff); }
  .bottom-nav-add-circle .ic { width:24px; height:24px; }
  .pcard-action-btn { width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); background:var(--bg-soft,#f8fafc); color:var(--muted); flex:none; text-decoration:none; }
  .pcard-action-btn .ic { width: 16px; height: 16px; }
  .pcard-action-btn.wa { background:rgba(37,211,102,0.1); border-color:rgba(37,211,102,0.25); color:#1a9e4f; }
  .pcard-action-btn.disabled { opacity:0.32; pointer-events:none; }

  /* ================= Premium Tab Transitions ================= */
  .tab-content {
    animation: tabFadeIn 150ms ease-out forwards;
  }
  @keyframes tabFadeIn {
    from { opacity: 0; transform: scale(0.98); }
    to { opacity: 1; transform: scale(1); }
  }

  /* ================= Skeleton Loaders ================= */
  .skeleton-card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px;
    border-radius: 12px;
    background: var(--bg-soft, #f8fafc);
    border: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .skeleton-header {
    height: 20px;
    background: linear-gradient(90deg, #e2e8f0 0%, #f1f5f9 50%, #e2e8f0 100%);
    background-size: 200% 100%;
    border-radius: 6px;
    animation: shimmer 2s infinite;
  }
  .skeleton-line {
    height: 12px;
    background: linear-gradient(90deg, #e2e8f0 0%, #f1f5f9 50%, #e2e8f0 100%);
    background-size: 200% 100%;
    border-radius: 4px;
    animation: shimmer 2s infinite;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ================= Form Validation Styles ================= */
  input.valid, textarea.valid, select.valid {
    border-color: #10b981;
    background-color: rgba(16, 185, 129, 0.02);
  }
  input.invalid, textarea.invalid, select.invalid {
    border-color: #ef4444;
    background-color: rgba(239, 68, 68, 0.02);
  }
  /* UX10: Enhanced inline validation with animations */
  .validation-helper {
    font-size: 11px;
    font-weight: 600;
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 4px;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.2s ease, opacity 0.2s ease;
  }
  .validation-helper.show {
    max-height: 20px;
    opacity: 1;
  }
  .validation-helper.valid {
    color: #10b981;
  }
  .validation-helper.invalid {
    color: #ef4444;
  }
  .validation-helper.invalid::before {
    content: '⚠ ';
    font-weight: 700;
  }
  .validation-helper.valid::before {
    content: '✓ ';
    font-weight: 700;
  }

  /* ================= Typography Standardization ================= */
  .text-l {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.2;
  }
  .text-m {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.5;
  }
  .text-s {
    font-size: 12px;
    font-weight: 400;
    line-height: 1.4;
  }

  /* ================= Expandable Sections ================= */
  .expandable-section {
    overflow: hidden;
    transition: max-height 200ms ease-out;
  }
  .expandable-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--accent);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    padding: 0;
    margin-top: 8px;
  }
  .expandable-toggle .chevron {
    display: inline-flex;
    transition: transform 200ms ease-out;
  }
  .expandable-toggle[aria-expanded="true"] .chevron {
    transform: rotate(180deg);
  }

  /* ================= Confirmation Dialog ================= */
  .confirm-dialog-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    display: flex;
    align-items: flex-end;
    z-index: 100;
    animation: overlayFadeIn 150ms ease-out forwards;
  }
  @keyframes overlayFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .confirm-dialog {
    width: 100%;
    background: var(--bg, #fff);
    border-radius: 20px 20px 0 0;
    padding: 24px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    animation: slideUp 250ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .confirm-dialog-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .confirm-dialog-message {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .confirm-dialog-actions {
    display: flex;
    flex-direction: column-reverse;
    gap: 8px;
  }
  .confirm-dialog-actions button {
    width: 100%;
    padding: 12px 16px;
    border-radius: 11px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    font-size: 13px;
  }
  .confirm-btn-destructive {
    background: #dc2626;
    color: #fff;
  }
  .confirm-btn-cancel {
    background: var(--bg-soft, #f8fafc);
    color: var(--ink);
    border: 1px solid var(--border);
  }

  /* ================= Icon Size Standardization ================= */
  .icon-24 { width: 24px !important; height: 24px !important; stroke-width: 2 !important; }
  .icon-20 { width: 20px !important; height: 20px !important; stroke-width: 2 !important; }
  .icon-16 { width: 16px !important; height: 16px !important; stroke-width: 2 !important; }

</style>

<script>
/* ================= IndexedDB layer ================= */

const DB_NAME = 'surgical-case-db';
const DB_VERSION = 2;
let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('patients')) db.createObjectStore('patients', { keyPath:'id' });
      if (!db.objectStoreNames.contains('images')) {
        const s = db.createObjectStore('images', { keyPath:'id' });
        s.createIndex('patientId','patientId',{unique:false});
      }
      if (!db.objectStoreNames.contains('clinicalBank')) db.createObjectStore('clinicalBank', { keyPath:'id' });
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
  return dbPromise;
}
async function storeOf(name, mode) { const db = await openDB(); return db.transaction(name, mode).objectStore(name); }
function reqToPromise(req) { return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); }

async function dbGetAllPatients() { const s = await storeOf('patients','readonly'); return reqToPromise(s.getAll()); }
async function dbPutPatient(p) { const s = await storeOf('patients','readwrite'); const r = await reqToPromise(s.put(p)); syncPatientToCloud(p); return r; }
async function dbDeletePatient(id) { const s = await storeOf('patients','readwrite'); const r = await reqToPromise(s.delete(id)); deletePatientFromCloud(id); return r; }

async function dbGetAllClinicalBank() { const s = await storeOf('clinicalBank','readonly'); return reqToPromise(s.getAll()); }
async function dbPutClinicalBank(c) { const s = await storeOf('clinicalBank','readwrite'); const r = await reqToPromise(s.put(c)); syncClinicalBankToCloud(c); return r; }
async function dbDeleteClinicalBank(id) {
  const s = await storeOf('clinicalBank','readwrite'); const r = await reqToPromise(s.delete(id));
  const imgs = (await dbGetAllImages()).filter(im => im.clinicalBankId === id);
  for (const img of imgs) await dbDeleteImage(img.id);
  deleteClinicalBankFromCloud(id);
  return r;
}

/* ================= Cloud Sync Engine (background, best-effort \u2014 local IndexedDB always stays the source of truth for the UI) ================= */
let SYNC_APPLYING_REMOTE = false; // true while writing incoming cloud changes locally, to avoid re-pushing them right back up
let SYNC_UNSUBSCRIBE = null;
function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error((label||'Request') + ' timed out \u2014 check your internet connection')), ms))
  ]);
}

/* ---- Pending-sync queue -----------------------------------------------------------
   A single failed upload used to just show a toast and vanish \u2014 easy to miss, and
   nothing ever retried it, so a patient/photo saved during a weak-signal moment could
   silently never reach the cloud. Every failure is now also recorded here (persisted
   to localStorage, so it survives a reload) and retried automatically \u2014 when the
   device comes back online, periodically while the app is open, and right after
   sign-in. A banner on the home screen shows the count so it's never silently missed. */
const PENDING_SYNC_KEY = 'surgical-case-log-pending-sync-v1';
function loadPendingSync() { try { return JSON.parse(localStorage.getItem(PENDING_SYNC_KEY) || '[]'); } catch (e) { return []; } }
function savePendingSync(list) { try { localStorage.setItem(PENDING_SYNC_KEY, JSON.stringify(list)); } catch (e) {} refreshPendingSyncBadge(); }
function addPendingSync(type, id) {
  const list = loadPendingSync();
  if (!list.some(x => x.type === type && x.id === String(id))) { list.push({ type, id: String(id) }); savePendingSync(list); }
}
function removePendingSync(type, id) {
  const list = loadPendingSync();
  const next = list.filter(x => !(x.type === type && x.id === String(id)));
  if (next.length !== list.length) savePendingSync(next);
}
function pendingSyncCount() { return loadPendingSync().length; }
function refreshPendingSyncBadge() { if (VIEW === 'list') render(); } // avoid disrupting an in-progress form on other screens

function syncPatientToCloud(p) {
  if (!CURRENT_USER || SYNC_APPLYING_REMOTE || !isAiTier()) return;
  try {
    const clean = JSON.parse(JSON.stringify(p));
    withTimeout(firestoreDB.collection('users').doc(CURRENT_USER.uid).collection('patients').doc(String(p.id)).set(clean), 20000, 'Sync')
      .then(function() { removePendingSync('patient', p.id); })
      .catch(function(err) { console.error('Cloud sync (save) failed for patient', p.id, err); addPendingSync('patient', p.id); toast('Cloud sync failed for "' + (p.name||p.id) + '" \u2014 will retry automatically'); });
  } catch (e) {}
}
/* ---- Doctor/Clinic Profile cloud sync \u2014 so a reinstall + sign-in restores it, not just
   patient data. Stored as a single doc rather than a live-synced collection since it's
   small and changes rarely; pulled once at sign-in, pushed on every save. AI tier only,
   same as everything else that touches Firestore. */
function syncProfileToCloud(profile) {
  if (!CURRENT_USER || !isAiTier()) return;
  try {
    firestoreDB.collection('users').doc(CURRENT_USER.uid).collection('meta').doc('profile').set(profile)
      .then(function() { removePendingSync('profile', 'profile'); })
      .catch(function(err) { console.error('Profile cloud sync failed', err); addPendingSync('profile', 'profile'); });
  } catch (e) {}
}
async function pullProfileFromCloud(uid) {
  if (!isAiTier()) return;
  try {
    const doc = await firestoreDB.collection('users').doc(uid).collection('meta').doc('profile').get();
    const local = loadProfile();
    if (doc.exists) {
      if (!profileIsComplete(local)) { saveProfile(doc.data(), true); if (VIEW === 'settings') render(); }
      else { syncProfileToCloud(local); } // keep cloud in step with whichever device was edited most recently
    } else {
      syncProfileToCloud(local); // first time signing in on this account \u2014 seed the cloud copy
    }
  } catch (e) {}
}
function deletePatientFromCloud(id) {
  if (!CURRENT_USER || SYNC_APPLYING_REMOTE || !isAiTier()) return;
  try {
    firestoreDB.collection('users').doc(CURRENT_USER.uid).collection('patients').doc(String(id)).delete()
      .catch(function(err) { console.error('Cloud sync (delete) failed for patient', id, err); });
  } catch (e) {}
}
function syncClinicalBankToCloud(c) {
  if (!CURRENT_USER || SYNC_APPLYING_REMOTE || !isAiTier()) return;
  try {
    const clean = JSON.parse(JSON.stringify(c));

/* Re-attempts every item currently in the pending queue. Safe to call often \u2014 it's a
   no-op when signed out or when the queue is empty, and each item is only removed from
   the queue once it's actually confirmed uploaded. */
async function retryPendingSync() {
  if (!CURRENT_USER || SYNC_APPLYING_REMOTE) return;
  const list = loadPendingSync();
  if (!list.length) return;
  const uidStr = CURRENT_USER.uid;
  for (const item of list) {
    try {
      if (item.type === 'patient') {
        const p = getPatient(item.id);
        if (!p) { removePendingSync('patient', item.id); continue; }
        const clean = JSON.parse(JSON.stringify(p));
        await withTimeout(firestoreDB.collection('users').doc(uidStr).collection('patients').doc(String(p.id)).set(clean), 20000, 'Sync');
        removePendingSync('patient', item.id);
      } else if (item.type === 'image') {
        const rec = await dbGetImage(item.id).catch(function() { return null; });
        if (!rec || !rec.blob) { removePendingSync('image', item.id); continue; }
        const contentType = rec.blob.type || 'image/jpeg';
        const meta = JSON.parse(JSON.stringify(Object.assign({}, rec, { contentType: contentType })));
        delete meta.blob;
        await withTimeout(firebaseStorage.ref('users/' + uidStr + '/images/' + rec.id).put(rec.blob, { contentType: contentType }), 30000, 'Photo sync');
        await withTimeout(firestoreDB.collection('users').doc(uidStr).collection('images').doc(String(rec.id)).set(meta), 20000, 'Sync');
        removePendingSync('image', item.id);
      } else if (item.type === 'profile') {
        await withTimeout(firestoreDB.collection('users').doc(uidStr).collection('meta').doc('profile').set(loadProfile()), 15000, 'Sync');
        removePendingSync('profile', 'profile');
      } else if (item.type === 'clinicalBank') {
        const c = CLINICAL_BANK.find(x => x.id === item.id) || await (async () => { const s = await storeOf('clinicalBank','readonly'); return reqToPromise(s.get(item.id)); })();
        if (!c) { removePendingSync('clinicalBank', item.id); continue; }
        const clean = JSON.parse(JSON.stringify(c));
        await withTimeout(firestoreDB.collection('users').doc(uidStr).collection('clinicalBank').doc(String(c.id)).set(clean), 20000, 'Sync');
        removePendingSync('clinicalBank', item.id);
      }
    } catch (err) {
      // Still failing (offline, etc.) \u2014 leave it queued, the next retry pass will try again.
    }
  }
}

/* An image counts as "unfiled" if it isn't yet visible anywhere in the normal tabs \u2014
   not linked to a follow-up/investigation/prescription, not an OT photo, and not
   already tagged with one of the categories that Images & Records shows even before
   linking (xray/clinical/wound/ct/mri/usg). This is the safety net for the
   immediate-commit fix in handlePhotoInputChange / handleCategorizedPhotoChange: if a
   form was ever abandoned before Save, the photo lands here instead of disappearing.
   Photos are NEVER auto-deleted by this check \u2014 only a person tapping Delete removes
   one, from the recovery screen itself. */
const UNFILED_VISIBLE_CATEGORIES = ['xray','clinical','wound','ct','mri','usg'];
function isUnfiledImage(img) {
  return !img.followUpId && !img.investigationId && !img.prescriptionId && !img.isIntraOp
    && !UNFILED_VISIBLE_CATEGORIES.includes(img.imageCategory);
}
async function computeUnfiledImages() {
  const all = await dbGetAllImages();
  return all.filter(isUnfiledImage).map(img => ({ img, patient: PATIENTS.find(p => p.id === img.patientId) || null }))
    .sort((a,b) => (b.img.createdAt||0) - (a.img.createdAt||0));
}

function syncImageToCloud(rec) {
  if (!CURRENT_USER || SYNC_APPLYING_REMOTE || !rec.blob || !isAiTier()) return;

    delete meta.blob;

      .then(function() { return firestoreDB.collection('users').doc(uid).collection('images').doc(String(rec.id)).set(meta); })
      .then(function() { removePendingSync('image', rec.id); })
      .catch(function(err) { console.error('Cloud image sync failed for', rec.id, err); addPendingSync('image', rec.id); toast('Photo cloud sync failed \u2014 will retry automatically'); });

async function applyRemoteImageChanges(snapshot, uid) {
  let changed = false;
  for (const change of snapshot.docChanges()) {
    if (change.type === 'removed') {
      SYNC_APPLYING_REMOTE = true;
      try { await dbDeleteImage(change.doc.id); changed = true; } finally { SYNC_APPLYING_REMOTE = false; }
      continue;
    }
    const existing = await dbGetImage(change.doc.id).catch(function() { return null; });
    if (existing) continue; // already have this photo locally, nothing to download
    try {
      const url = await firebaseStorage.ref('users/' + uid + '/images/' + change.doc.id).getDownloadURL();
      const resp = await fetch(url);
      const blob = await resp.blob();
      const meta = change.doc.data();
      delete meta.contentType;
      SYNC_APPLYING_REMOTE = true;
      try { await dbAddImage(Object.assign({}, meta, { id: change.doc.id, blob: blob })); changed = true; }
      finally { SYNC_APPLYING_REMOTE = false; }
    } catch (err) { console.error('Image download failed for', change.doc.id, err); toast('Photo download failed: ' + (err && err.message ? err.message : 'unknown error')); }
  }
  if (changed && VIEW === 'list') render();
}

/* ================= Image resize (with safe fallback) ================= */

async function toDisplayableBlob(file) {
  // iPhone photos are often HEIC/HEIF, which <img>/canvas cannot decode directly in the browser.
  // Convert to JPEG first so it can actually be previewed, stored, and displayed later.
  const isHeic = /heic|heif/i.test(file.type || '') || /\.(heic|heif)$/i.test(file.name || '');
  if (isHeic && typeof heic2any !== 'undefined') {
    try {
      const converted = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.85 });
      return Array.isArray(converted) ? converted[0] : converted;
    } catch (err) {
      return file; // fallback to original if conversion fails
    }
  }
  return file;
}

async function resizeImageFile(file, maxDim, quality) {
  maxDim = maxDim || 1600; quality = quality || 0.82;
  let workingFile;
  try { workingFile = await toDisplayableBlob(file); } catch (e) { workingFile = file; }
  return new Promise((resolve) => {
    try {
      const url = URL.createObjectURL(workingFile);
      const img = new Image();
      img.onload = () => {
        try {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width > height) { height = Math.round(height * maxDim/width); width = maxDim; }
            else { width = Math.round(width * maxDim/height); height = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob((blob) => {
            URL.revokeObjectURL(url);
            resolve(blob || workingFile); // fallback to (converted) original if toBlob fails
          }, 'image/jpeg', quality);
        } catch (err) { URL.revokeObjectURL(url); resolve(workingFile); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(workingFile); };
      img.src = url;
    } catch (err) { resolve(workingFile); }
  });
}

function computeRelativeFollowupDate(num, unit) {
  const n = parseInt(num, 10);
  if (!n || n < 1) return '';
  const d = new Date();
  if (unit === 'weeks') d.setDate(d.getDate() + n * 7);
  else if (unit === 'months') d.setMonth(d.getMonth() + n);
  else d.setDate(d.getDate() + n); // days
  return d.toISOString().slice(0,10);
}

  return '<div><div class="row between" style="margin-bottom:6px;"><label class="field-label" style="margin-bottom:0;">Region</label>'+(autoDetectAction?aiButtonHtml(autoDetectAction,'Auto-detect',false,null,'gemini'):'')+'</div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:6px;">' + REGION_GROUP_KEYS.map(chip).join('') + '</div></div>'
    + '<div><label class="field-label">Specialty</label>'
    + '<div style="display:flex;flex-wrap:wrap;gap:6px;">' + SPECIALTY_GROUP_KEYS.map(chip).join('') + '</div></div>';
}
/* Lightweight, offline keyword match \u2014 lets diagnosis/complaints text silently switch on
   the relevant Special Tracking module instead of the doctor having to pick it manually.
   Never overrides a choice already made. */
function autoDetectCondition(text) {
  const t = (text||'').toLowerCase();
  if (/\bctev\b|club\s?foot|clubfoot/.test(t)) return 'ctev';
  if (/rheumatoid arthritis|\brheumatoid\b/.test(t)) return 'ra';
  if (/osteoporosis|osteopenia|low bone density/.test(t)) return 'osteoporosis';
  if (/fracture|\bfx\b|#|dislocation|\btrauma\b/.test(t)) return 'trauma';
  return '';
}
function autoDetectRegions(text) {
  const t = (' '+(text||'').toLowerCase()+' ');
  return CASE_REGIONS.filter(r => r.keywords.some(k => t.includes(k))).map(r => r.key);
}
/* AI-powered region detection (falls back to the offline keyword matcher above on failure
   or when AI features aren't available for this account). */
async function aiAutoDetectRegions(text) {
  if (!(isAiTier())) return null;
  if (!text || !text.trim()) return null;
  try {
    const askClaude = callGeminiDirect;
    const validKeys = CASE_REGIONS.map(r => r.key);
    const sys = 'Classify an orthopaedic case into the relevant region(s)/specialty from this exact list only: ' + validKeys.join(', ') + '. Given the complaints/diagnosis/procedure text, return a JSON array of matching keys from that list (usually 1-2, exact spelling). Return ONLY the JSON array, no other text.';
    const result = await askClaude({ systemPrompt: sys, userMessage: text, maxTokens: 80 });
    let raw = (result.data.text || '').trim();
    raw = raw.replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/```\s*$/, '').trim();
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return null;
    const filtered = arr.filter(k => validKeys.includes(k));
    return filtered.length ? filtered : null;
  } catch (e) { return null; }
}

/* ================= Premium UX Helpers ================= */
// Haptic feedback (mobile only)
/* UX9: Enhanced Haptic Feedback with patterns */
function haptic(duration = 10) { if (navigator.vibrate) navigator.vibrate(duration); }
function hapticSuccess() { if (navigator.vibrate) navigator.vibrate([10, 5, 10]); } // light double tap
function hapticWarning() { if (navigator.vibrate) navigator.vibrate([20, 10, 20]); } // medium double tap
function hapticError() { if (navigator.vibrate) navigator.vibrate([30, 10, 30, 10, 30]); } // strong triple tap
function hapticDelete() { if (navigator.vibrate) navigator.vibrate([50, 30, 50]); } // heavy double tap

// Confirmation dialog
async function showConfirmDialog(opts) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'confirm-dialog-overlay';
    overlay.innerHTML = `
      <div class="confirm-dialog">
        <div class="confirm-dialog-title">${opts.title || 'Confirm'}</div>
        <div class="confirm-dialog-message">${opts.message || ''}</div>
        <div class="confirm-dialog-actions">
          <button class="confirm-btn-cancel" type="button">${opts.cancelText || 'Cancel'}</button>
          <button class="confirm-btn-${opts.destructive ? 'destructive' : 'primary'}" type="button">${opts.confirmText || 'Confirm'}</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    
    const buttons = overlay.querySelectorAll('button');
    const cancelBtn = buttons[0];
    const confirmBtn = buttons[1];
    
    cancelBtn.focus();
    
    cancelBtn.addEventListener('click', () => {
      overlay.remove();
      resolve(false);
    });
    confirmBtn.addEventListener('click', () => {
      haptic(15);
      overlay.remove();
      if (opts.onConfirm) opts.onConfirm();
      resolve(true);
    });
    
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) {
        overlay.remove();
        resolve(false);
      }
    });
  });
}

// Auto-focus first input in form
function autoFocusFirstInput(container) {

// Real-time validation for input fields
function setupValidationListener(inputEl, validator) {
  let timeout;
  inputEl.addEventListener('input', () => {
    clearTimeout(timeout);
    timeout = setTimeout(() => {
      const result = validator(inputEl.value.trim());
      if (result.valid) {
        inputEl.classList.add('valid');
        inputEl.classList.remove('invalid');
        if (result.message) {
          const helper = inputEl.nextElementSibling;
          if (helper && helper.classList.contains('validation-helper')) {
            helper.className = 'validation-helper valid';
            helper.innerHTML = '✓ ' + result.message;
          }
        }
      } else if (inputEl.value.length > 0) {
        inputEl.classList.add('invalid');
        inputEl.classList.remove('valid');
        if (result.message) {
          const helper = inputEl.nextElementSibling;
          if (helper && helper.classList.contains('validation-helper')) {
            helper.className = 'validation-helper invalid';
            helper.innerHTML = '✗ ' + result.message;
          }
        }
      }
    }, 300);
  });
}

// Setup swipe navigation for tab switching
function setupSwipeNavigation(container, onSwipeLeft, onSwipeRight) {
  if (!container) return;
  // Store the latest callbacks on the element itself so re-renders (which call this again
  // on the same persistent #tab-body node) just update the callbacks instead of stacking
  // duplicate touchstart/touchend listeners \u2014 duplicate listeners meant a single swipe
  // could fire multiple tab changes at once, which could cascade into a broken render.
  container._swipeOnLeft = onSwipeLeft;
  container._swipeOnRight = onSwipeRight;
  if (container.dataset.swipeBound === '1') return;
  container.dataset.swipeBound = '1';

  let touchStart = 0, touchEnd = 0, touchStartY = 0, touchEndY = 0;

  container.addEventListener('touchstart', (e) => {
    touchStart = e.changedTouches[0].clientX;
    touchStartY = e.changedTouches[0].clientY;
  }, { passive: true });

  container.addEventListener('touchend', (e) => {
    touchEnd = e.changedTouches[0].clientX;
    touchEndY = e.changedTouches[0].clientY;

    const horizontalDiff = touchStart - touchEnd;
    const verticalDiff = Math.abs(touchStartY - touchEndY);

    // Only trigger swipe if horizontal movement > vertical and > 50px threshold
    if (Math.abs(horizontalDiff) > 50 && Math.abs(horizontalDiff) > verticalDiff) {
      if (horizontalDiff > 0 && container._swipeOnLeft) container._swipeOnLeft();
      else if (horizontalDiff < 0 && container._swipeOnRight) container._swipeOnRight();
    }
  }, { passive: true });
}

/* askGemini isn't reachable via the standard {region}-{project}.cloudfunctions.net address
   (it was deployed straight to Cloud Run, which only gets a run.app URL) \u2014 so instead of
   firebaseFunctions.httpsCallable, this replicates the callable-functions HTTPS protocol by
   hand: POST {data:...} with the user's Firebase ID token, matching the shape callable
   clients expect back ({result:...} on success). Drop-in replacement for httpsCallable('askGemini')
   \u2014 call sites can keep doing askGemini({...}) and reading result.data.text unchanged. */
const ASK_GEMINI_URL = 'https://askgemini-251974181391.asia-south2.run.app';
async function callGeminiDirect(payload) {
  const user = firebase.auth().currentUser;
  if (!user) throw new Error('Sign in first.');
  
  // Check token limit before calling
  if (!await canUseAI()) throw new Error('Token limit reached');
  
  const idToken = await user.getIdToken();
  const res = await fetch(ASK_GEMINI_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken },
    body: JSON.stringify({ data: payload }),
  });
  const json = await res.json().catch(() => null);
  if (!res.ok || !json || json.error) {
    throw new Error((json && json.error && json.error.message) || ('Gemini request failed (' + res.status + ')'));
  }
  
  // Log token usage if response includes it
  if (json.result && (json.result.inputTokens || json.result.outputTokens)) {
    await logTokenUsage(user.uid, json.result.inputTokens, json.result.outputTokens);
  }
  
  return { data: json.result };
}

async function computeActivityFeed() {
  const events = [];

  });
  const allImages = await dbGetAllImagesWithCache();
  allImages.filter(im => im.createdAt && im.createdAt >= sevenDaysAgo).forEach(im => {
    const p = PATIENTS.find(x => x.id === im.patientId);
    events.push({ icon:'camera', color:'var(--accent)', ts: im.createdAt, title: 'New image added', sub: p ? escName(p.name)+(p.patientCode?' ('+p.patientCode+')':'') : 'Unfiled photo', jumpPatientId: im.patientId });
  });
  PATIENTS.forEach(p => (p.followUps||[]).forEach(f => {
    const ts = f.createdAt || new Date(f.date).getTime();
    if (ts >= sevenDaysAgo) events.push({ icon:'calendar', color:'#0d9488', ts, title: 'Follow-up logged: ' + f.label, sub: escName(p.name)+(p.patientCode?' ('+p.patientCode+')':''), jumpPatientId: p.id });
  }));

function relativeTimeAgo(ts) {
  const mins = Math.max(0, Math.round((Date.now() - ts) / 60000));
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + ' hr' + (hrs > 1 ? 's' : '') + ' ago';
  const days = Math.round(hrs / 24);
  return days + ' day' + (days > 1 ? 's' : '') + ' ago';
}

/* P3: Lazy Load Images with IntersectionObserver */
function setupImageLazyLoading(container) {
  if (!container || !('IntersectionObserver' in window)) return;
  const images = container.querySelectorAll('img[data-src]');
  if (images.length === 0) return;
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const img = entry.target;
        const dataSrc = img.getAttribute('data-src');
        if (dataSrc) {
          img.src = dataSrc;
          img.removeAttribute('data-src');
          img.style.opacity = '1';
          observer.unobserve(img);
        }
      }
    });
  }, { rootMargin: '50px' });
  images.forEach(img => observer.observe(img));
}

function loadTextLibrary(key) {

function recordTextUsed(key, value) {
  if (!value || !value.trim()) return;
  const v = value.trim();
  const lib = loadTextLibrary(key);

  if (existing) { existing.useCount = (existing.useCount||1)+1; existing.lastUsed = Date.now(); }

function updateAutocomplete(targetId, libKey, query, selectAction) {

  if (q.length < 2) { box.style.display = 'none'; box.innerHTML = ''; return; }

function computeDashboardStats() {
  const today = todayStr();
  if (DASHBOARD_STATS_CACHE_DATE === today && DASHBOARD_STATS_CACHE) {
    return DASHBOARD_STATS_CACHE;
  }
  const sevenDaysAgo = new Date(); sevenDaysAgo.setDate(sevenDaysAgo.getDate()-6);
  const sevenDaysAgoStr = sevenDaysAgo.toISOString().slice(0,10);

  const isTrackable = p => !p.status || p.status === 'Active' || p.status === 'Active follow-up';
  const dueToday = PATIENTS.filter(p => isTrackable(p) && p.nextFollowUpDate === today);
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
  const tomorrowStr = tomorrow.toISOString().slice(0,10);
  const dueTomorrowList = PATIENTS.filter(p => isTrackable(p) && p.nextFollowUpDate === tomorrowStr);
  const overdue = PATIENTS.filter(p => isTrackable(p) && isOverdue(p.nextFollowUpDate));
  const raDueToday = PATIENTS.filter(p => isTrackable(p) && p.condition === 'ra' && p.ra && p.ra.nextLabsDate === today);
  const raOverdue = PATIENTS.filter(p => isTrackable(p) && p.condition === 'ra' && p.ra && isOverdue(p.ra.nextLabsDate));
  const dexaDueToday = PATIENTS.filter(p => isTrackable(p) && p.condition === 'osteoporosis' && p.osteo && p.osteo.nextDexaDate === today);
  const dexaOverdue = PATIENTS.filter(p => isTrackable(p) && p.condition === 'osteoporosis' && p.osteo && isOverdue(p.osteo.nextDexaDate));

  /* Everything that needs attention today or is already overdue, across follow-ups, RA labs, and DEXA scans */
  const important = [
    ...overdue.map(p => ({ patient:p, type:'Follow-up', label:'Follow-up overdue', isOverdue:true, date:p.nextFollowUpDate })),
    ...raOverdue.map(p => ({ patient:p, type:'RA labs', label:'RA labs overdue', isOverdue:true, date:p.ra.nextLabsDate })),
    ...dexaOverdue.map(p => ({ patient:p, type:'DEXA scan', label:'DEXA scan overdue', isOverdue:true, date:p.osteo.nextDexaDate })),
    ...dueToday.map(p => ({ patient:p, type:'Follow-up', label:'Follow-up due today', isOverdue:false, date:p.nextFollowUpDate })),
    ...raDueToday.map(p => ({ patient:p, type:'RA labs', label:'RA labs due today', isOverdue:false, date:p.ra.nextLabsDate })),
    ...dexaDueToday.map(p => ({ patient:p, type:'DEXA scan', label:'DEXA scan due today', isOverdue:false, date:p.osteo.nextDexaDate })),
  ].sort((a,b) => overdueDays(b.date) - overdueDays(a.date));
  const surgeriesThisWeek = PATIENTS.filter(p => p.caseType==='surgical' && p.surgeryDate >= sevenDaysAgoStr && p.surgeryDate <= today).length;
  const activeCases = PATIENTS.filter(p => !p.status || p.status === 'Active' || p.status === 'Active follow-up').length;

  /* Daily new-case counts for the last 7 days (oldest first), for the dashboard sparkline */
  const weekTrend = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const dayKey = d.toISOString().slice(0,10);
    const count = PATIENTS.filter(p => p.createdAt && new Date(p.createdAt).toISOString().slice(0,10) === dayKey).length;
    weekTrend.push({ day: d.toLocaleDateString('en-IN',{weekday:'narrow'}), count });
  }
  const weekNewCases = weekTrend.reduce((sum,d) => sum + d.count, 0);

  const result = { dueToday, overdue, raDueToday, raOverdue, dexaDueToday, dexaOverdue, important, surgeriesThisWeek, activeCases, weekTrend, weekNewCases, dueTomorrowList };
  DASHBOARD_STATS_CACHE = result;
  DASHBOARD_STATS_CACHE_DATE = today;
  return result;
}

/* Shows at most one notification per calendar day, only once permission has been granted and the
   toggle is on, summarising anything overdue or due today across follow-ups / RA labs / DEXA scans.
   If any case is critically overdue (7+ days), a short sound plays alongside the notification. */
async function maybeNotifyToday() {
  try {
    if (!isNotifEnabled()) return;
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    const todayKey = todayStr();
    let lastShown; try { lastShown = localStorage.getItem(NOTIF_LAST_SHOWN_KEY); } catch(e) {}
    if (lastShown === todayKey) return;
    const s = computeDashboardStats();
    if (!s.important.length) return;
    const overdueCount = s.important.filter(i => i.isOverdue).length;
    const todayCount = s.important.length - overdueCount;
    const criticalItems = s.important.filter(i => i.isOverdue && overdueDays(i.date) >= 7);
    const parts = [];
    if (overdueCount) parts.push(overdueCount + ' overdue');
    if (todayCount) parts.push(todayCount + ' due today');
    let body = parts.join(', ') + ' \u2014 follow-ups, RA labs or DEXA scans.';
    if (criticalItems.length) {
      body = '\u26a0\ufe0f ' + criticalItems.length + ' critical (7+ days overdue): ' + criticalItems[0].patient.name
        + (criticalItems.length > 1 ? ' +' + (criticalItems.length - 1) + ' more' : '') + '. ' + body;
    }
    try { new Notification('OrthoVault', { body, icon: 'icons/icon-192.png', requireInteraction: criticalItems.length > 0 }); } catch(e) {}
    if (criticalItems.length) playCriticalAlert();
    try { localStorage.setItem(NOTIF_LAST_SHOWN_KEY, todayKey); } catch(e) {}
  } catch (e) {}
}

  if (p.caseType !== 'surgical' || !p.surgeryDate || !dateStr) return null;

function piraniTotal(components) { return PIRANI_COMPONENTS.reduce((s,p)=>s+(components[p.key]||0),0); }

/* ---- RA: DAS28 / CDAI / SDAI scoring ---- */
function calcDAS28ESR(tjc, sjc, esr, ptGlobal100) {
  if (tjc==null||sjc==null||esr==null||ptGlobal100==null||esr<=0) return null;
  return 0.56*Math.sqrt(tjc) + 0.28*Math.sqrt(sjc) + 0.70*Math.log(esr) + 0.014*ptGlobal100;
}
function calcDAS28CRP(tjc, sjc, crpMgL, ptGlobal100) {
  if (tjc==null||sjc==null||crpMgL==null||ptGlobal100==null||crpMgL<0) return null;
  return 0.56*Math.sqrt(tjc) + 0.28*Math.sqrt(sjc) + 0.36*Math.log(crpMgL+1) + 0.014*ptGlobal100 + 0.96;
}
function calcCDAI(tjc, sjc, ptGlobal10, phGlobal10) {
  if (tjc==null||sjc==null||ptGlobal10==null||phGlobal10==null) return null;
  return tjc + sjc + ptGlobal10 + phGlobal10;
}
function calcSDAI(tjc, sjc, ptGlobal10, phGlobal10, crpMgL) {
  if (tjc==null||sjc==null||ptGlobal10==null||phGlobal10==null||crpMgL==null) return null;
  return tjc + sjc + ptGlobal10 + phGlobal10 + (crpMgL/10);
}
function bandDAS28(s) { if (s==null) return null; if (s<2.6) return {label:'Remission',cls:'remission'}; if (s<=3.2) return {label:'Low activity',cls:'low'}; if (s<=5.1) return {label:'Moderate activity',cls:'moderate'}; return {label:'High activity',cls:'high'}; }
function bandCDAI(s) { if (s==null) return null; if (s<=2.8) return {label:'Remission',cls:'remission'}; if (s<=10) return {label:'Low activity',cls:'low'}; if (s<=22) return {label:'Moderate activity',cls:'moderate'}; return {label:'High activity',cls:'high'}; }
function bandSDAI(s) { if (s==null) return null; if (s<=3.3) return {label:'Remission',cls:'remission'}; if (s<=11) return {label:'Low activity',cls:'low'}; if (s<=26) return {label:'Moderate activity',cls:'moderate'}; return {label:'High activity',cls:'high'}; }
function computeRaVisitScores(v) {
  const das28esr = calcDAS28ESR(v.tjc, v.sjc, v.esr, v.ptGlobal);
  const das28crp = calcDAS28CRP(v.tjc, v.sjc, v.crp, v.ptGlobal);
  const ptGlobal10 = v.ptGlobal!=null ? v.ptGlobal/10 : null;
  const cdai = calcCDAI(v.tjc, v.sjc, ptGlobal10, v.phGlobal);
  const sdai = calcSDAI(v.tjc, v.sjc, ptGlobal10, v.phGlobal, v.crp);
  return { das28esr, das28crp, cdai, sdai };
}
function raScoreBadgeHtml(label, value, band) {
  if (value == null || !band) return '';
  return '<div class="score-badge score-'+band.cls+'"><span class="sl">'+label+'</span><span class="sv">'+value.toFixed(2)+'</span></div>';
}

function computeWeeklyDigestStats() {
  const now = new Date();
  const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
  const weekAhead = new Date(); weekAhead.setDate(weekAhead.getDate() + 7);
  let surgeriesThisWeek = 0, newOpdThisWeek = 0, overdueFollowUps = 0, dueNext7Days = 0;
  PATIENTS.forEach(p => {
    const d = p.surgeryDate ? new Date(p.surgeryDate) : null;
    if (d && d >= weekAgo && d <= now) {
      if (p.caseType === 'surgical') surgeriesThisWeek++; else newOpdThisWeek++;
    }
    if (isOverdue(p.nextFollowUpDate)) overdueFollowUps++;
    else if (p.nextFollowUpDate) {
      const fu = new Date(p.nextFollowUpDate);
      if (fu >= now && fu <= weekAhead) dueNext7Days++;
    }
  });
  return { surgeriesThisWeek, newOpdThisWeek, overdueFollowUps, dueNext7Days, totalPatients: PATIENTS.length };
}

function schemeQuickMatch(queryText, limit) {
  const q = (queryText || '').trim().toLowerCase();
  if (!q) return [];
  const words = q.split(/[\s,.-]+/).filter(w => w.length > 2);
  if (!words.length) return [];
  function scoreList(list, type) {
    return list.map(item => {
      const hay = (item.n + ' ' + (item.g||'')).toLowerCase();
      const matchCount = words.filter(w => hay.includes(w)).length;
      return matchCount ? { item, type, score: matchCount } : null;
    }).filter(Boolean);
  }
  const combined = [...scoreList(SCHEME_RGHS, 'rghs'), ...scoreList(SCHEME_MAA, 'maa')];
  combined.sort((a,b) => b.score - a.score);
  return combined.slice(0, limit || 3);
}

function schemeSearchResults() {
  const q = (SCHEME_FINDER_QUERY || '').trim().toLowerCase();
  const list = SCHEME_FINDER_TYPE === 'rghs' ? SCHEME_RGHS : SCHEME_MAA;
  if (!q) return list.slice(0, 25);
  const words = q.split(/\s+/).filter(Boolean);
  return list.filter(item => {
    const hay = (item.n + ' ' + item.c + ' ' + (item.g||'')).toLowerCase();
    return words.every(w => hay.includes(w));
  }).slice(0, 40);
}

async function purchaseSubscription(sku) {
  try {
    if (!('getDigitalGoodsService' in window)) {
      toast('In-app purchases are only available in the Play Store app version.');
      return;
    }
    const service = await window.getDigitalGoodsService('https://play.google.com/billing');
    const details = await service.getDetails([sku]);
    if (!details || !details.length) { toast('Subscription not found. Try again later.'); return; }
    if (!details[0].price || !details[0].price.currency) { toast('Invalid subscription details. Try again later.'); return; }

    const paymentMethodData = [{ supportedMethods: 'https://play.google.com/billing', data: { sku } }];
    const paymentDetails = { total: { label: 'Total', amount: { currency: details[0].price.currency, value: '0' } } };
    const request = new PaymentRequest(paymentMethodData, paymentDetails);
    const response = await request.show();
    if (!response || !response.details || !response.details.purchaseToken) { toast('Payment response invalid. Please try again.'); return; }
    const purchaseToken = response.details.purchaseToken;
    await response.complete('success');

    // Verify server-side and update CURRENT_PLAN
    const uid = CURRENT_USER && CURRENT_USER.uid;
    if (!uid) { toast('Please sign in first.'); return; }
    const verifyRes = await fetch('https://verify-purchase-251974181391.asia-south2.run.app', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uid, sku, purchaseToken })
    });
    if (!verifyRes.ok) { toast('Verification failed. Please contact support.'); return; }
    const verifyData = await verifyRes.json();
    if (verifyData && verifyData.plan) {
      CURRENT_PLAN = verifyData.plan;
      toast('Subscribed! Welcome to ' + (verifyData.plan === 'ai' ? 'AI' : 'Pro') + ' tier.');
      VIEW = 'more'; render();
    } else {
      toast('Purchase completed but verification failed. Contact support.');
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return; // user cancelled
    console.error('Purchase error:', e);
    toast('Purchase failed. Please try again.');
  }
}

function cbAllTags() {
  const set = new Set();
  CLINICAL_BANK.forEach(c => (c.tags||[]).forEach(t => set.add(t)));

}

function cbTagEditorHtml() {
  const suggestions = cbAllTags().filter(t => !CB_DRAFT_TAGS.includes(t));

async function cbThumbsHtml(entryId) {
  let html = '<div class="thumb-grid">';
  if (entryId) {
    const imgs = (await dbGetAllImages()).filter(im => im.clinicalBankId === entryId);
    revokeActiveUrls();
    imgs.forEach(im => {
      const url = trackUrl(URL.createObjectURL(im.blob));
      html += '<div class="thumb-wrap" data-action="view-image" data-imgid="'+im.id+'" data-url="'+esc(url)+'"><img src="'+esc(url)+'"></div>';
    });
    html += '<label class="add-photo-tile">'+ic('camera')+'<span>Gallery</span><input type="file" accept="image/*" multiple data-cb-photo-input="'+entryId+'" style="display:none;"></label>'
      + '</div>' + cameraFabHtml('data-cb-photo-input="'+entryId+'"', 'Take photo');

    CB_DRAFT_PHOTOS.forEach(ph => {
      html += '<div class="thumb-wrap"><img src="'+ph.previewUrl+'"><button class="thumb-remove" data-action="cb-remove-draft-photo" data-tempid="'+ph.tempId+'">\u2715</button></div>';
    });

      + '</div>' + cameraFabHtml('data-cb-photo-input="new"', 'Take photo');
  }
  return html;
}
async function handleCbPhotoInputChange(fileInput, entryId) {
  const files = Array.from(fileInput.files || []);
  if (!files.length) return;
  toast('Saving '+files.length+' photo'+(files.length>1?'s':'')+'\u2026');
  for (const file of files) {
    const blob = await resizeImageFile(file);
    if (entryId) {
      await dbAddImage({ id: uid(), patientId: null, clinicalBankId: entryId, blob, createdAt: Date.now(), imageCategory: 'clinical-bank' });
    } else {
      CB_DRAFT_PHOTOS.push({ tempId: uid(), blob, previewUrl: trackUrl(URL.createObjectURL(blob)) });
    }
  }
  const container = document.getElementById('cb-thumbs');
  if (container) container.innerHTML = await cbThumbsHtml(entryId);
  toast('Saved');
}

function cbFilteredEntries() {
  const q = CB_SEARCH.trim().toLowerCase();
  return [...CLINICAL_BANK].sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).filter(c => {
    if (!q) return true;
    if ((c.note||'').toLowerCase().includes(q)) return true;
    if ((c.name||'').toLowerCase().includes(q)) return true;
    return (c.tags||[]).some(t => t.toLowerCase().includes(q));
  });
}

function cbResultsListHtml(filtered, imageMap) {
  if (!filtered.length) {
    return '<div style="text-align:center;color:var(--muted);font-size:12px;padding:40px 0;">'
